function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

const ACTIONS = [
  ['up', 'Move / Aim Up'], ['down', 'Move / Aim Down'], ['left', 'Move / Aim Left'], ['right', 'Move / Aim Right'],
  ['dash', 'Garuda Dash'], ['shield', 'Sudarshan Shield'],
  ['agni', 'Cast Agni'], ['maya', 'Cast Maayu'], ['kala', 'Cast Kala']

const DEFAULT_BINDS = {
  p1: { up: [87, 'W'], down: [83, 'S'], left: [65, 'A'], right: [68, 'D'], dash: [32, 'SPACE'], shield: [67, 'C'], agni: [81, 'Q'], maya: [69, 'E'], kala: [82, 'R'] },
  p2: { up: [38, '↑'], down: [40, '↓'], left: [37, '←'], right: [39, '→'], dash: [13, 'ENTER'], shield: [16, 'SHIFT'], agni: [74, 'J'], maya: [75, 'K'], kala: [76, 'L'] }
};
const GRADES = { off: 'Off', royal: 'Royal Gold', agni: 'Agni Cinema', contrast: 'High Contrast' };
const THEMES = {
  dark:  { name: 'Ratri · Midnight Obsidian', bg: 0x08090F, lattice: 0x1b1f30, dot: 0x23283d, frame: C.gold, ambient: 0x5a6890, ambientAlpha: 0.55, shadow: 0.5 },
  light: { name: 'Surya · Royal Sandstone',   bg: 0xF4E3C1, lattice: 0xe6cfa2, dot: 0xd8b77c, frame: C.terracotta, ambient: 0xffffff, ambientAlpha: 0, shadow: 0.32 }
};
const SETTINGS_KEY = 'chakravyuh.settings.v2';
const Settings = {
  theme: 'dark', grade: 'royal', quality: 'high', volume: 0.75, sfxMute: false,
  binds: JSON.parse(JSON.stringify(DEFAULT_BINDS)),
  load() {
    try {
      const s = JSON.parse(localStorage.getItem(SETTINGS_KEY) || 'null');
      if (!s) return;
      ['theme', 'grade', 'quality', 'volume', 'sfxMute'].forEach(k => { if (s[k] !== undefined) this[k] = s[k]; });
      if (s.binds && s.binds.p1 && s.binds.p2) {
        ['p1', 'p2'].forEach(p => ACTIONS.forEach(([a]) => { if (Array.isArray(s.binds[p][a])) this.binds[p][a] = s.binds[p][a]; }));
      }
    } catch (e) { /* storage blocked — defaults stay */ }
  },
  save() {
    try { localStorage.setItem(SETTINGS_KEY, JSON.stringify({ theme: this.theme, grade: this.grade, quality: this.quality, volume: this.volume, sfxMute: this.sfxMute, binds: this.binds })); }
    catch (e) { /* storage blocked */ }
  },
  resetBinds() { this.binds = JSON.parse(JSON.stringify(DEFAULT_BINDS)); this.save(); },
  // assigning a key that is already bound elsewhere swaps the two bindings so nothing is ever double-bound
  bind(p, action, code, label) {
    let clash = null;
    ['p1', 'p2'].forEach(q => ACTIONS.forEach(([a]) => { if (this.binds[q][a][0] === code && !(q === p && a === action)) clash = [q, a]; }));
    if (clash) this.binds[clash[0]][clash[1]] = this.binds[p][action].slice();
    this.binds[p][action] = [code, label];
    this.save();
    return clash;
  },
  particles() { return this.quality === 'ultra' ? 1.6 : 1; }
};
Settings.load();
const theme = () => THEMES[Settings.theme] || THEMES.dark;
document.body.classList.toggle('light', Settings.theme === 'light');

function keyLabel(e) {
  const named = { ' ': 'SPACE', ArrowUp: '↑', ArrowDown: '↓', ArrowLeft: '←', ArrowRight: '→', Enter: 'ENTER', Shift: 'SHIFT',
    Control: 'CTRL', Alt: 'ALT', Tab: 'TAB', Backspace: 'BKSP', CapsLock: 'CAPS' };
  if (named[e.key]) return named[e.key];
  if (e.code && e.code.startsWith('Numpad')) return 'NUM' + e.code.slice(6).replace('Decimal', '.');
  return (e.key || '?').length === 1 ? e.key.toUpperCase() : e.key.toUpperCase().slice(0, 6);
}

// Electron desktop build exposes window.electronAPI.quit() from its preload script

  try { window.close(); } catch (e) { /* browsers may refuse */ }

// ---------------------------------------------------------------------
// CONTROL SCHEMES — Player 1 keeps the left binding set, Player 2 the right;
// whichever role a player holds, their own keys drive it.
// ---------------------------------------------------------------------
function moveLabel(b) {
  const k = [b.up[1], b.left[1], b.down[1], b.right[1]].join('');
  if (k === 'WASD') return 'WASD';
  if (k === '↑←↓→') return 'ARROWS';
  return [b.up[1], b.left[1], b.down[1], b.right[1]].join(' ');
}
function ctrlScheme(pIdx, role, kind) {
  const b = Settings.binds[kind === 'local' ? (pIdx === 0 ? 'p1' : 'p2') : 'p1'];
  const extraMove = kind === 'local' ? '' : ' / ARROWS';
  const mv = [b.up[1], b.left[1], b.down[1], b.right[1]];
  if (role === 'runner') {
    return { moveLabel: 'MOVE', moveKeys: mv, actLabel: 'SKILLS', actKeys: [b.dash[1], b.shield[1]], cast: null,
      text: moveLabel(b) + extraMove + ' move · ' + b.dash[1] + ' dash · ' + b.shield[1] + ' shield' };
  }
  const cast = [b.agni[1], b.maya[1], b.kala[1]];
  return { moveLabel: 'AIM', moveKeys: kind === 'local' ? mv : ['MOUSE'].concat(mv), actLabel: 'CAST', actKeys: cast, cast,
    text: (kind === 'local' ? moveLabel(b) : 'MOUSE/' + moveLabel(b)) + ' aim · ' + cast.join(' ') + ' cast' };
}

// ---------------------------------------------------------------------
// NETWORK — PeerJS WebRTC data channel, host-authoritative
// ---------------------------------------------------------------------
const NET_PREFIX = 'chakravyuh-ps02-';
const CODE_ABC = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
const Net = {
  peer: null, conn: null, online: false, isHost: false, code: '', handlers: {}, flags: {}, onLost: null,

  available() { return typeof Peer !== 'undefined'; },
  me() { return this.isHost ? 0 : 1; },
  makeCode() {
    if (window.__forceCode) return window.__forceCode;
    let s = '';
    for (let i = 0; i < 5; i++) s += CODE_ABC[Math.floor(Math.random() * CODE_ABC.length)];
    return s;
  },
  setHandlers(h) { this.handlers = h || {}; },
  send(o) { if (this.conn && this.conn.open) { try { this.conn.send(o); } catch (e) { /* channel closing */ } } },

  // The host is reachable two ways at once: a PeerJS WebRTC id and a Firebase RTDB room.
  // Guests try WebRTC first and fall back to the Firebase relay (works behind strict NATs).
  host(cb) {
    this.reset();
    this.isHost = true; this.via = '';
    const relayGuest = () => {
      if (this.conn) return;
      const rc = new RelayConn(this.code, 'host');
      this.attach(rc, () => { this.via = 'relay'; cb('connected'); });
      rc.markOpen();
    };
    const announce = () => FB.canRelay() ? FB.createRoom(this.code, relayGuest) : Promise.resolve();
    if (!this.available()) {
      if (!FB.canRelay()) { cb('error', 'Online play needs PeerJS or Firebase — check the internet connection'); return; }
      const tryCode = n => {
        this.code = this.makeCode();
        announce().then(() => cb('code', this.code))
          .catch(e => { if (e && e.code === 'room-taken' && n < 4) tryCode(n + 1); else cb('error', FB.describe(e)); });
      };
      tryCode(0);
      return;
    }
    const open = attempt => {
      this.code = this.makeCode();
      const peer = new Peer(NET_PREFIX + this.code.toLowerCase(), { debug: 1 });
      this.peer = peer;
      peer.on('open', () => { cb('code', this.code); announce().catch(() => { /* WebRTC still works without the room record */ }); });
      peer.on('connection', conn => {
        if (this.conn) {
          conn.on('open', () => { conn.send({ t: 'full' }); setTimeout(() => conn.close(), 300); });
          return;
        }
        this.attach(conn, () => { this.via = 'p2p'; cb('connected'); });
      });
      peer.on('error', err => {
        if (this.peer !== peer) return;
        if (err.type === 'unavailable-id' && attempt < 4 && !window.__forceCode) { peer.destroy(); open(attempt + 1); }
        else if (!this.online && !FB.hostCode) cb('error', this.describe(err));
      });
      peer.on('disconnected', () => { if (this.peer === peer && !this.conn && !FB.hostCode) cb('error', 'Lost contact with the PeerJS signalling server'); });
    };
    open(0);
  },

  join(code, cb) {
    this.reset();
    this.isHost = false; this.code = code; this.via = '';
    let settled = false, timer = null;
    const finish = (ev, data) => { if (settled) return; settled = true; clearTimeout(timer); cb(ev, data); };
    const relay = reason => {
      if (settled || this.relaying) return;
      if (!FB.canRelay()) { finish('error', reason); return; }
      this.relaying = true;
      clearTimeout(timer);
      const peer = this.peer; this.peer = null;
      try { if (peer) peer.destroy(); } catch (e) { /* already gone */ }
      cb('status', 'Direct WebRTC link unavailable — connecting through the Firebase relay…');
      FB.joinRoom(code).then(() => {
        const rc = new RelayConn(code, 'guest');
        this.attach(rc, () => { this.via = 'relay'; finish('connected'); });
        rc.markOpen();
      }).catch(e => finish('error', FB.describe(e)));
    };
    if (!this.available() || window.__forceRelay) { relay('PeerJS is unavailable — check the internet connection'); return; }
    timer = setTimeout(() => relay('Connection timed out — check the code and that the host is waiting'), 9000);
    const peer = new Peer({ debug: 1 });
    this.peer = peer;
    peer.on('open', () => {
      if (this.peer !== peer) return;
      const conn = peer.connect(NET_PREFIX + code.toLowerCase(), { reliable: true, serialization: 'json' });
      this.attach(conn, () => { this.via = 'p2p'; finish('connected'); });
    });
    peer.on('error', err => { if (this.peer === peer && !this.online) relay(this.describe(err)); });
  },

  attach(conn, onOpen) {
    const ready = () => {
      if (this.conn) return;
      this.conn = conn; this.online = true; this.flags = {};
      if (this.isHost) FB.roomPlaying(this.code);
      onOpen();
    };
    if (conn.open) ready(); else conn.on('open', ready);
    // events from a link that never became the active one (e.g. an abandoned WebRTC attempt) are ignored
    conn.on('data', d => { if (this.conn === conn) this.dispatch(d); });
    conn.on('close', () => { if (this.conn === conn) this.lost('Your opponent disconnected'); });
    conn.on('error', () => { if (this.conn === conn) this.lost('The connection to your opponent failed'); });
  },

  dispatch(d) {
    if (!d || !d.t) return;
    if (d.t === 'bye') { this.lost('Your opponent left the match'); return; }
    if (d.t === 'ready') this.flags.ready = true;
    const h = this.handlers[d.t];
    if (h) h(d);
  },

  lost(reason) {
    if (!this.online) return;
    const cb = this.onLost;
    this.reset();
    if (cb) cb(reason);
  },

  leave() {
    if (this.conn && this.conn.open) this.send({ t: 'bye' });
    const peer = this.peer, conn = this.conn, room = this.isHost ? this.code : '';
    this.peer = null; this.conn = null; this.online = false; this.handlers = {}; this.relaying = false;
    setTimeout(() => {
      try { if (conn) conn.close(); } catch (e) { /* already closed */ }
      try { if (peer) peer.destroy(); } catch (e) { /* already destroyed */ }
      if (room) FB.closeRoom(room);
    }, 250);
  },

  reset() {
    const peer = this.peer, conn = this.conn;
    if (this.isHost && this.code) FB.closeRoom(this.code);
    this.peer = null; this.conn = null; this.online = false; this.handlers = {}; this.flags = {}; this.relaying = false;
    try { if (conn) conn.close(); } catch (e) { /* already closed */ }
    try { if (peer) peer.destroy(); } catch (e) { /* already destroyed */ }
  },

  describe(err) {
    switch (err && err.type) {
      case 'peer-unavailable': return 'Room not found — check the code with the host';
      case 'network': case 'server-error': case 'socket-error': case 'socket-closed':
        return 'Cannot reach the PeerJS signalling server — both laptops need internet';
      case 'browser-incompatible': return 'This browser does not support WebRTC';
      case 'unavailable-id': return 'That room code is busy — try hosting again';
      default: return 'Network error: ' + ((err && err.type) || 'unknown');
    }
  }
};

const FIREBASE_CONFIG = {

const FB = {
  ready: false, user: null, status: 'connecting', error: '', listeners: [], lastSave: null, hostCode: '', guestWatch: null,
  isWeb: /^https?:$/.test(location.protocol),

  init() {
    if (typeof firebase === 'undefined') { this.status = 'offline'; this.error = 'Firebase SDK could not load (offline?)'; return; }

      firebase.initializeApp(FIREBASE_CONFIG);
      this.auth = firebase.auth(); this.db = firebase.database(); this.fs = firebase.firestore();

      // Analytics only runs on the hosted web build (it needs cookies, which file:// and Electron lack)

      let first = true;
      this.auth.onAuthStateChanged(u => {

        if (u) { this.status = 'online'; this.error = ''; }
        else if (first) this.signInGuest().catch(() => { /* reported through status */ });   // silent guest session
        else this.status = 'signed-out';
        first = false;
        this.emit();
      });
    } catch (e) { this.status = 'offline'; this.error = e.message; }
  },
  onChange(fn) { this.listeners.push(fn); return () => { this.listeners = this.listeners.filter(f => f !== fn); }; },
  emit() { this.listeners.slice().forEach(f => { try { f(); } catch (e) { /* listener belonged to a closed scene */ } }); },
  canRelay() { return this.ready && !!this.user; },
  provider() { return !this.user ? '' : this.user.isAnonymous ? 'Guest' : 'Google'; },
  name() {
    if (!this.user) return 'Offline';
    return (this.user.displayName || ('Yodha-' + this.user.uid.slice(0, 4).toUpperCase())).slice(0, 18);
  },
  statusLine() {
    if (this.status === 'online') return '● ' + this.name() + ' · ' + this.provider();
    if (this.status === 'connecting') return '◌ Connecting to Firebase…';
    if (this.status === 'signed-out') return '○ Signed out — click to sign in';
    return '✕ ' + (this.error || 'Firebase offline');
  },

  async signInGuest(name) {
    if (!this.ready) throw { code: 'fb/offline' };
    this.status = 'connecting'; this.emit();
    try {
      const cred = await this.auth.signInAnonymously();
      if (name) await cred.user.updateProfile({ displayName: name });
      this.user = this.auth.currentUser; this.status = 'online'; this.emit();
    } catch (e) { this.status = 'error'; this.error = this.describe(e); this.emit(); throw e; }
  },
  // upgrading a guest links Google to the same uid, so earlier Hall of Fame entries stay theirs
  async signInGoogle() {
    if (!this.ready) throw { code: 'fb/offline' };
    if (!this.isWeb) throw { code: 'fb/google-desktop' };
    const provider = new firebase.auth.GoogleAuthProvider();
    const cur = this.auth.currentUser;
    if (cur && cur.isAnonymous) {
      try { await cur.linkWithPopup(provider); }
      catch (e) {
        if (e.code === 'auth/credential-already-in-use' && e.credential) await this.auth.signInWithCredential(e.credential);
        else throw e;
      }
    } else await this.auth.signInWithPopup(provider);
    this.user = this.auth.currentUser; this.status = 'online'; this.emit();
  },
  async setName(name) {
    if (!this.user) throw { code: 'fb/offline' };
    await this.user.updateProfile({ displayName: name });
    this.emit();
  },
  async signOut() { if (this.ready) await this.auth.signOut(); },

  describe(e) {
    const c = (e && e.code) || '';
    const rules = 'Firebase rules rejected this — deploy firestore.rules and database.rules.json';
    const map = {
      'auth/operation-not-allowed': 'That sign-in method is disabled — enable it in Firebase Console → Authentication',
      'auth/admin-restricted-operation': 'Anonymous sign-in is disabled — enable "Anonymous" in Firebase Console → Authentication',
      'auth/unauthorized-domain': 'This domain is not authorised — add it in Firebase Auth → Settings → Authorised domains',
      'auth/popup-blocked': 'The browser blocked the Google pop-up — allow pop-ups and try again',
      'auth/popup-closed-by-user': 'Google sign-in was cancelled',
      'auth/cancelled-popup-request': 'Google sign-in was cancelled',
      'auth/network-request-failed': 'No connection to Firebase — check the internet',
      'permission-denied': rules, 'PERMISSION_DENIED': rules,
      'failed-precondition': 'Firestore index missing — run: npx firebase-tools deploy --only firestore:indexes',
      'unavailable': 'Firestore is unreachable right now',
      'fb/offline': 'Firebase is offline',
      'fb/google-desktop': 'Google sign-in works on the web build — the desktop app uses a guest profile',
      'room-not-found': 'Room not found — check the code with the host',
      'room-full': 'That room already has two players',
      'room-taken': 'That room code is busy — try hosting again'
    };
    return map[c] || ((e && e.message) ? String(e.message).slice(0, 100) : 'Firebase error');
  },

  // ---- Firestore Hall of Fame ----
  async submitRound(r, label) {
    if (!this.canRelay()) { this.lastSave = { ok: false, msg: this.ready ? 'Not signed in — score not saved' : 'Offline — score not saved' }; this.emit(); return; }
    const st = STAGES.find(s => s.name === r.stage) || STAGES[0];
    const ts = firebase.firestore.FieldValue.serverTimestamp();
    const doc = {
      uid: this.user.uid, name: label.slice(0, 24), score: Math.max(0, Math.min(6000, Math.round(r.score))),
      stage: st.key, stageName: st.name, escaped: !!r.escaped, relics: r.relics | 0, traps: Math.min(200, r.traps | 0),
      timeLeft: Math.round(r.timeLeft * 10) / 10, kind: Match.kind, diff: Match.kind === 'solo' ? Match.diff : '', createdAt: ts
    };
    this.lastSave = { ok: null, msg: 'Saving to the Hall of Fame…' }; this.emit();
    try {
      await this.fs.collection('leaderboard').add(doc);
      const pref = this.fs.collection('players').doc(this.user.uid);
      await this.fs.runTransaction(async tx => {
        const s = await tx.get(pref), d = s.exists ? s.data() : {};
        tx.set(pref, {
          name: this.name(), rounds: (d.rounds || 0) + 1, escapes: (d.escapes || 0) + (doc.escaped ? 1 : 0),
          totalScore: (d.totalScore || 0) + doc.score, bestScore: Math.max(d.bestScore || 0, doc.score), updatedAt: ts
        });
      });
      this.lastSave = { ok: true, msg: 'Saved to the Hall of Fame · ' + doc.score + ' pts' };
    } catch (e) { this.lastSave = { ok: false, msg: 'Score not saved — ' + this.describe(e) }; }
    this.emit();
  },
  async topScores(stageKey) {
    let q = this.fs.collection('leaderboard');
    if (stageKey) q = q.where('stage', '==', stageKey);
    const snap = await q.orderBy('score', 'desc').limit(10).get();
    return snap.docs.map(d => d.data());
  },
  async myStats() {
    if (!this.user) return null;
    const s = await this.fs.collection('players').doc(this.user.uid).get();
    return s.exists ? s.data() : null;
  },

  // ---- Realtime Database rooms ----
  roomRef(code) { return this.db.ref('rooms/' + code); },
  async createRoom(code, onRelayGuest) {
    const ref = this.roomRef(code);
    const res = await ref.transaction(cur => cur ? undefined : {
      host: this.user.uid, hostName: this.name(), status: 'open', created: firebase.database.ServerValue.TIMESTAMP
    });
    if (!res.committed) throw { code: 'room-taken' };
    // relay first: its rules check the room's host, so it must go before the room itself
    this.db.ref('relay/' + code).onDisconnect().remove();
    ref.onDisconnect().remove();
    await this.db.ref('relay/' + code).remove();
    this.hostCode = code;
    let seen = false;
    this.guestWatch = ref.child('guest');
    this.guestWatch.on('value', s => {
      const g = s.val();
      if (g && !seen) { seen = true; if (g.via === 'relay') onRelayGuest(g); }
    });
  },
  roomPlaying(code) { if (this.canRelay() && code && this.hostCode === code) this.roomRef(code).update({ status: 'playing' }).catch(() => {}); },
  closeRoom(code) {
    if (!this.ready || !code || this.hostCode !== code) return;
    if (this.guestWatch) { this.guestWatch.off(); this.guestWatch = null; }
    this.hostCode = '';
    const ref = this.roomRef(code), relay = this.db.ref('relay/' + code);
    ref.onDisconnect().cancel(); relay.onDisconnect().cancel();
    relay.remove().catch(() => {});
    ref.remove().catch(() => {});
  },
  async joinRoom(code) {
    const ref = this.roomRef(code);
    const room = (await ref.once('value')).val();
    if (!room) throw { code: 'room-not-found' };
    if (room.guest && room.guest.uid !== this.user.uid) throw { code: 'room-full' };
    const gref = ref.child('guest');
    await gref.set({ uid: this.user.uid, name: this.name(), via: 'relay', at: firebase.database.ServerValue.TIMESTAMP });
    gref.onDisconnect().remove();
    return room;
  },
  watchOpenRooms(cb) {
    if (!this.canRelay()) { cb([]); return () => {}; }
    const q = this.db.ref('rooms').orderByChild('status').equalTo('open').limitToLast(8);
    const fn = s => {
      const out = [];
      s.forEach(c => { const v = c.val(); if (v && Date.now() - (v.created || 0) < 30 * 60000) out.push({ code: c.key, name: v.hostName || 'Host' }); });
      cb(out.reverse());
    };
    q.on('value', fn, () => cb([]));
    return () => q.off('value', fn);
  }
};

// A Firebase Realtime Database channel that looks like a PeerJS DataConnection, so the game
// code is identical over WebRTC or the relay. High-rate messages (snapshots, input, aim) are
// "latest value" slots flushed at 20 Hz; everything else is an ordered queue the receiver consumes.
const RELAY_LATEST = { s: 1, in: 1, ret: 1 };
class RelayConn {
  constructor(code, side) {
    this.code = code; this.side = side; this.open = false; this.closed = false; this.h = {}; this.pending = {};
    const base = FB.db.ref('relay/' + code), me = side === 'host' ? 'h2g' : 'g2h', them = side === 'host' ? 'g2h' : 'h2g';
    this.outQ = base.child(me + '/q'); this.outL = base.child(me + '/l');
    this.inQ = base.child(them + '/q'); this.inL = base.child(them + '/l');
    this.qFn = this.inQ.on('child_added', snap => { const v = snap.val(); snap.ref.remove().catch(() => {}); if (!this.closed) this.fire('data', v); });
    this.lFn = snap => { if (!this.closed) this.fire('data', snap.val()); };
    this.inL.on('child_added', this.lFn); this.inL.on('child_changed', this.lFn);
    // presence: the host watches the guest slot, the guest watches the room itself
    this.watch = side === 'host' ? FB.roomRef(code).child('guest') : FB.roomRef(code);
    this.wFn = this.watch.on('value', s => { if (!s.exists() && this.open) this.close(); });
    this.timer = setInterval(() => this.flush(), 50);
  }
  on(ev, fn) { (this.h[ev] = this.h[ev] || []).push(fn); if (ev === 'open' && this.open) setTimeout(fn, 0); return this; }
  fire(ev, a) { (this.h[ev] || []).forEach(f => f(a)); }
  markOpen() { this.open = true; this.fire('open'); }
  send(o) {
    if (this.closed) return;
    o = JSON.parse(JSON.stringify(o));               // RTDB rejects undefined values
    if (RELAY_LATEST[o.t]) this.pending[o.t] = o; else this.outQ.push(o).catch(() => {});
  }
  flush() {
    Object.keys(this.pending).forEach(t => this.outL.child(t).set(this.pending[t]).catch(() => {}));
    this.pending = {};
  }
  close() {
    if (this.closed) return;
    this.flush();
    this.closed = true; this.open = false;
    clearInterval(this.timer);
    this.inQ.off('child_added', this.qFn);
    this.inL.off('child_added', this.lFn); this.inL.off('child_changed', this.lFn);
    this.watch.off('value', this.wFn);
    if (this.side === 'guest') FB.roomRef(this.code).child('guest').remove().catch(() => {});
    else FB.closeRoom(this.code);
    this.fire('close');
  }
}
FB.init();

// ---------------------------------------------------------------------
// WEB AUDIO SYNTH — tabla, sitar, tanpura drone, shankha conch and SFX
// ---------------------------------------------------------------------
const SA = 146.83;                                   // D3 as Sa
const YAMAN = [0, 2, 4, 6, 7, 9, 11, 12, 14, 16, 18, 19];
const THEKA = ['dha', 'dhin', 'dhin', 'dha', 'dha', 'dhin', 'dhin', 'dha',
               'dha', 'tin', 'tin', 'ta', 'ta', 'dhin', 'dhin', 'dha'];

const AudioFX = {
  ctx: null, muted: false, music: null, drone: null,

  init() {
    try {
      if (!this.ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        const c = new AC();
        this.ctx = c;
        this.master = c.createGain();
        this.master.gain.value = this.masterLevel();
        this.comp = c.createDynamicsCompressor();
        this.comp.threshold.value = -14; this.comp.ratio.value = 4;
        this.master.connect(this.comp); this.comp.connect(c.destination);
        this.musicBus = c.createGain(); this.musicBus.gain.value = 0.42; this.musicBus.connect(this.master);
        this.sfxBus = c.createGain(); this.sfxBus.gain.value = Settings.sfxMute ? 0 : 0.9; this.sfxBus.connect(this.master);
        // echo send gives a temple-hall feel
        this.send = c.createGain(); this.send.gain.value = 0.3;
        const dl = c.createDelay(1); dl.delayTime.value = 0.27;
        const fb = c.createGain(); fb.gain.value = 0.32;
        const wet = c.createBiquadFilter(); wet.type = 'lowpass'; wet.frequency.value = 2600;
        this.send.connect(dl); dl.connect(fb); fb.connect(dl); dl.connect(wet); wet.connect(this.master);
        const len = c.sampleRate;
        const buf = c.createBuffer(1, len, c.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
        this.noiseBuf = buf;
      }
      if (this.ctx.state === 'suspended') this.ctx.resume();
    } catch (e) { this.ctx = null; }
  },

  masterLevel() { return this.muted ? 0 : Settings.volume; },
  applyLevels() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    this.master.gain.setTargetAtTime(this.masterLevel(), t, 0.05);
    this.sfxBus.gain.setTargetAtTime(Settings.sfxMute ? 0 : 0.9, t, 0.05);
  },
  toggleMute() { this.muted = !this.muted; this.applyLevels(); return this.muted; },
  setVolume(v) { Settings.volume = Math.max(0, Math.min(1, Math.round(v * 20) / 20)); Settings.save(); this.applyLevels(); },
  setSfxMute(m) { Settings.sfxMute = m; Settings.save(); this.applyLevels(); },

  tone(o) {
    if (!this.ctx) return;
    const c = this.ctx, t = o.when || c.currentTime, d = o.dur || 0.2;
    const osc = c.createOscillator();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(o.freq, t);
    if (o.freqEnd) osc.frequency.exponentialRampToValueAtTime(Math.max(1, o.freqEnd), t + (o.glide || d));
    if (o.detune) osc.detune.value = o.detune;
    const g = c.createGain();
    const a = Math.min(o.attack || 0.005, d * 0.5);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(o.vol || 0.2, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    let node = osc;
    if (o.filter) {
      const f = c.createBiquadFilter();
      f.type = o.filter; f.frequency.setValueAtTime(o.ff || 1000, t);
      if (o.ffEnd) f.frequency.exponentialRampToValueAtTime(o.ffEnd, t + d);
      f.Q.value = o.q || 1;
      osc.connect(f); node = f;
    }
    node.connect(g); g.connect(o.bus || this.sfxBus);
    if (o.send) g.connect(this.send);
    osc.start(t); osc.stop(t + d + 0.05);
  },

  noise(o) {
    if (!this.ctx) return;
    const c = this.ctx, t = o.when || c.currentTime, d = o.dur || 0.2;
    const src = c.createBufferSource(); src.buffer = this.noiseBuf; src.loop = true;
    const f = c.createBiquadFilter(); f.type = o.filter || 'lowpass';
    f.frequency.setValueAtTime(o.ff || 1000, t);
    if (o.ffEnd) f.frequency.exponentialRampToValueAtTime(o.ffEnd, t + d);
    f.Q.value = o.q || 1;
    const g = c.createGain();
    const a = Math.min(o.attack || 0.005, d * 0.6);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(o.vol || 0.2, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    src.connect(f); f.connect(g); g.connect(o.bus || this.sfxBus);
    if (o.send) g.connect(this.send);
    src.start(t, Math.random() * 0.8); src.stop(t + d + 0.05);
  },

  sitar(f, t, d, v, bus) {
    if (!this.ctx) return;
    const c = this.ctx; t = t || c.currentTime; d = d || 0.8; v = v || 0.1;
    const out = bus || this.musicBus;
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(v, t + 0.006);
    g.gain.exponentialRampToValueAtTime(v * 0.35, t + 0.14);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 2.5;
    bp.frequency.setValueAtTime(Math.min(9000, f * 9), t);
    bp.frequency.exponentialRampToValueAtTime(f * 2.2, t + d * 0.7);
    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = f * 3;
    const lpg = c.createGain(); lpg.gain.value = 0.6;
    [-8, 8].forEach(dt => {
      const o = c.createOscillator(); o.type = 'sawtooth'; o.detune.value = dt;
      o.frequency.setValueAtTime(f * 0.962, t);
      o.frequency.exponentialRampToValueAtTime(f, t + 0.055);         // meend into the note
      o.connect(bp); o.connect(lp); o.start(t); o.stop(t + d + 0.05);
    });
    lp.connect(lpg); lpg.connect(g); bp.connect(g);
    g.connect(out); g.connect(this.send);
  },

  // shankha: breathy sawtooth through vowel-like formants with a rising swell and vibrato
  conch(when, dur) {
    if (!this.ctx) return;
    const c = this.ctx, t = when || c.currentTime, d = dur || 2.4, f = 233;
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.32, t + 0.45);
    g.gain.setValueAtTime(0.32, t + d - 0.6);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    const lfo = c.createOscillator(); lfo.frequency.value = 5.2;
    const lg = c.createGain(); lg.gain.value = 3.5; lfo.connect(lg);
    const f1 = c.createBiquadFilter(); f1.type = 'bandpass'; f1.frequency.value = 720; f1.Q.value = 4;
    const f2 = c.createBiquadFilter(); f2.type = 'bandpass'; f2.frequency.value = 1180; f2.Q.value = 6;
    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2400;
    [1, 2, 3].forEach((h, i) => {
      const o = c.createOscillator(); o.type = i === 0 ? 'sawtooth' : 'triangle';
      o.frequency.setValueAtTime(f * h * 0.93, t);
      o.frequency.exponentialRampToValueAtTime(f * h, t + 0.35);
      lg.connect(o.frequency);
      const og = c.createGain(); og.gain.value = [0.7, 0.35, 0.18][i];
      o.connect(og); og.connect(f1); og.connect(f2); og.connect(lp);
      o.start(t); o.stop(t + d + 0.05);
    });
    const breath = c.createBufferSource(); breath.buffer = this.noiseBuf; breath.loop = true;
    const bf = c.createBiquadFilter(); bf.type = 'bandpass'; bf.frequency.value = 1500; bf.Q.value = 1.5;
    const bg = c.createGain(); bg.gain.value = 0.06;
    breath.connect(bf); bf.connect(bg); bg.connect(g);
    breath.start(t); breath.stop(t + d + 0.05);
    lfo.start(t); lfo.stop(t + d + 0.05);
    const mix = c.createGain(); mix.gain.value = 0.55;
    f1.connect(mix); f2.connect(mix); lp.connect(mix); mix.connect(g);
    g.connect(this.sfxBus); g.connect(this.send);
  },

  // ---- tabla strokes ----
  bayan(t, v) {
    this.tone({ when: t, type: 'sine', freq: 150, freqEnd: 58, glide: 0.22, dur: 0.5, vol: 0.55 * v, bus: this.musicBus });
    this.noise({ when: t, dur: 0.04, vol: 0.12 * v, filter: 'lowpass', ff: 500, bus: this.musicBus });
  },
  dayan(t, v, f, d) {
    this.tone({ when: t, type: 'triangle', freq: f, dur: d, vol: 0.15 * v, bus: this.musicBus });
    this.tone({ when: t, type: 'sine', freq: f * 2.01, dur: d * 0.6, vol: 0.05 * v, bus: this.musicBus });
    this.noise({ when: t, dur: 0.015, vol: 0.07 * v, filter: 'highpass', ff: 3500, bus: this.musicBus });
  },
  bol(b, t, v) {
    switch (b) {
      case 'dha':  this.bayan(t, v); this.dayan(t, v, 523, 0.16); break;
      case 'dhin': this.bayan(t, v * 0.9); this.dayan(t, v, 392, 0.32); break;
      case 'tin':  this.dayan(t, v * 0.9, 392, 0.3); break;
      case 'ta':   this.dayan(t, v, 660, 0.12); break;
      case 'te':   this.noise({ when: t, dur: 0.05, vol: 0.06 * v, filter: 'bandpass', ff: 2800, q: 1.5, bus: this.musicBus }); break;
      case 'ge':   this.tone({ when: t, type: 'sine', freq: 85, freqEnd: 130, glide: 0.3, dur: 0.5, vol: 0.5 * v, bus: this.musicBus }); break;
    }
  },
  tablaRoll(when, n, gap) {
    if (!this.ctx) return; const t = when || this.ctx.currentTime;
    for (let i = 0; i < n; i++) this.bol(i % 3 === 0 ? 'dha' : i % 3 === 1 ? 'ta' : 'te', t + i * gap, 0.6 + 0.4 * (i / n));
    this.bol('dha', t + n * gap, 1.1);
  },
  tanpura(t, idx) {
    const notes = [SA * 0.75, SA, SA, SA * 0.5];
    const f = notes[idx % 4];
    this.tone({ when: t, type: 'sawtooth', freq: f, dur: 1.8, vol: 0.05, attack: 0.02, filter: 'lowpass', ff: 1400, ffEnd: 500, bus: this.musicBus });
    this.tone({ when: t, type: 'sine', freq: f * 2, dur: 1.4, vol: 0.025, bus: this.musicBus });
  },

  // ---- music scheduler ----
  startMusic(mode) {
    this.init();
    if (!this.ctx) return;
    if (this.music && this.music.mode === mode) return;
    this.stopMusic();
    const m = { mode, step: 0, next: this.ctx.currentTime + 0.12, mi: 4,
      tempo: mode === 'title' ? 84 : mode === 'results' ? 128 : 112 };
    this.music = m;
    this.startDrone();
    m.timer = setInterval(() => this.schedule(), 25);
  },
  stopMusic() {
    if (this.music) { clearInterval(this.music.timer); this.music = null; }
    this.stopDrone();
  },
  setTempo(t) { if (this.music) this.music.tempo = t; },
  schedule() {
    const m = this.music; if (!m || !this.ctx) return;
    const now = this.ctx.currentTime;
    if (m.next < now - 0.25) m.next = now + 0.05;    // tab was throttled — resync
    while (m.next < now + 0.12) {
      if (!m.hold) this.playStep(m, m.step, m.next);
      m.next += 60 / m.tempo / 2;
      m.step = (m.step + 1) % 32;
    }
  },
  holdMusic(on) { if (this.music) this.music.hold = on; },
  playStep(m, s, t) {
    const matra = s >> 1, even = s % 2 === 0;
    if (m.mode === 'title') {
      if (even && (matra === 0 || matra === 8 || matra === 12)) this.bol(matra === 8 ? 'tin' : 'dha', t, matra === 0 ? 0.9 : 0.55);
      if (s % 8 === 0) this.tanpura(t, s / 8);
      if (even && Math.random() < 0.22) this.melody(m, t, 1.1, 0.085);
    } else {
      const hot = m.tempo > 125;
      if (even) this.bol(THEKA[matra], t, matra === 0 ? 1 : 0.72);
      else if (Math.random() < (m.mode === 'results' ? 0.55 : hot ? 0.6 : 0.28)) this.bol('te', t, 0.5);
      if (matra === 15 && !even && Math.random() < 0.5) this.bol('ge', t, 0.7);
      if (s % 8 === 0) this.tanpura(t, s / 8);
      const p = m.mode === 'results' ? 0.55 : hot ? 0.42 : 0.3;
      if (Math.random() < p && (even || m.mode === 'results')) this.melody(m, t, m.mode === 'results' ? 0.4 : 0.55, 0.075);
    }
  },
  melody(m, t, d, v) {
    m.mi = Math.max(0, Math.min(YAMAN.length - 1, m.mi + Math.floor(Math.random() * 5) - 2));
    this.sitar(SA * 2 * Math.pow(2, YAMAN[m.mi] / 12), t, d, v);
  },
  startDrone() {
    if (!this.ctx || this.drone) return;
    const c = this.ctx, now = c.currentTime;
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, now); g.gain.exponentialRampToValueAtTime(0.045, now + 2);
    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 480; lp.Q.value = 2;
    const lfo = c.createOscillator(); lfo.frequency.value = 0.12;
    const lg = c.createGain(); lg.gain.value = 180;
    lfo.connect(lg); lg.connect(lp.frequency);
    const os = [SA / 2, SA * 0.75, SA].map((f, i) => {
      const o = c.createOscillator(); o.type = i === 2 ? 'triangle' : 'sawtooth';
      o.frequency.value = f; o.detune.value = (i - 1) * 4; o.connect(lp); o.start(); return o;
    });
    lfo.start(); lp.connect(g); g.connect(this.musicBus);
    this.drone = { g, os: os.concat([lfo]) };
  },
  stopDrone() {
    if (!this.drone || !this.ctx) return;
    const c = this.ctx, d = this.drone, now = c.currentTime;
    this.drone = null;
    d.g.gain.cancelScheduledValues(now);
    d.g.gain.setValueAtTime(Math.max(0.0001, d.g.gain.value), now);
    d.g.gain.exponentialRampToValueAtTime(0.0001, now + 0.6);

// PROCEDURAL ART HELPERS

function petalPts(cx, cy, ang, r1, r2, w) {
  const pts = [], n = 8, ca = Math.cos(ang), sa = Math.sin(ang);
  for (let i = 0; i <= n; i++) {
    const t = i / n, r = r1 + (r2 - r1) * t, off = Math.sin(Math.PI * Math.pow(t, 0.8)) * w;
    pts.push({ x: cx + ca * r - sa * off, y: cy + sa * r + ca * off });
  }
  for (let i = n - 1; i > 0; i--) {
    const t = i / n, r = r1 + (r2 - r1) * t, off = -Math.sin(Math.PI * Math.pow(t, 0.8)) * w;
    pts.push({ x: cx + ca * r - sa * off, y: cy + sa * r + ca * off });
  }
  return pts;
}

function drawMandala(g, cx, cy, R, cols, n, a) {
  n = n || 12; a = a === undefined ? 1 : a;
  const [c0, c1, c2, c3] = cols;
  const lw = k => Math.max(1, R * k);
  g.lineStyle(lw(0.014), c0, 0.95 * a); g.strokeCircle(cx, cy, R * 0.99);
  g.lineStyle(lw(0.006), c1, 0.8 * a); g.strokeCircle(cx, cy, R * 0.93);
  for (let i = 0; i < n * 2; i++) {
    const ang = i / (n * 2) * TAU;
    g.fillStyle(i % 2 ? c1 : c2, 0.6 * a);
    g.fillPoints(petalPts(cx, cy, ang, R * 0.6, R * 0.9, R * 0.075), true);
  }
  g.fillStyle(c3, 0.95 * a);
  for (let i = 0; i < n * 4; i++) {
    const ang = i / (n * 4) * TAU;
    g.fillCircle(cx + Math.cos(ang) * R * 0.96, cy + Math.sin(ang) * R * 0.96, lw(0.012));
  }
  g.lineStyle(lw(0.008), c0, 0.9 * a); g.strokeCircle(cx, cy, R * 0.6);
  for (let i = 0; i < n; i++) {
    const ang = i / n * TAU + Math.PI / n;
    const p = petalPts(cx, cy, ang, R * 0.3, R * 0.62, R * 0.1);
    g.fillStyle(c0, 0.75 * a); g.fillPoints(p, true);
    g.lineStyle(lw(0.006), c3, 0.9 * a); g.strokePoints(p, true);
  }
  const st = [];
  for (let i = 0; i < n * 2; i++) {
    const ang = i / (n * 2) * TAU, r = i % 2 ? R * 0.19 : R * 0.31;
    st.push({ x: cx + Math.cos(ang) * r, y: cy + Math.sin(ang) * r });
  }
  g.fillStyle(c2, 0.85 * a); g.fillPoints(st, true);
  g.lineStyle(lw(0.007), c3, a); g.strokePoints(st, true);
  g.fillStyle(c1, 0.95 * a); g.fillCircle(cx, cy, R * 0.17);
  g.lineStyle(lw(0.006), c3, a); g.strokeCircle(cx, cy, R * 0.13);
  for (let i = 0; i < 8; i++) {
    g.fillStyle(c0, a);
    g.fillPoints(petalPts(cx, cy, i / 8 * TAU, R * 0.02, R * 0.12, R * 0.035), true);
  }
  g.fillStyle(c3, a); g.fillCircle(cx, cy, R * 0.03);
}

// Sri Yantra: nine interlocking triangles inside lotus rings
function drawSriYantra(g, cx, cy, R, col, a) {
  g.lineStyle(Math.max(1.5, R * 0.012), col, a);
  g.strokeCircle(cx, cy, R); g.strokeCircle(cx, cy, R * 0.92);
  for (let i = 0; i < 16; i++) g.strokePoints(petalPts(cx, cy, i / 16 * TAU, R * 0.72, R * 0.9, R * 0.06), true);
  for (let i = 0; i < 8; i++) g.strokePoints(petalPts(cx, cy, i / 8 * TAU + Math.PI / 8, R * 0.56, R * 0.72, R * 0.08), true);
  const tri = (s, up, dy) => {
    const r = R * 0.55 * s, y = cy + dy * R;
    const p = up ? [{ x: cx, y: y - r }, { x: cx + r * 0.95, y: y + r * 0.55 }, { x: cx - r * 0.95, y: y + r * 0.55 }]
                 : [{ x: cx, y: y + r }, { x: cx + r * 0.95, y: y - r * 0.55 }, { x: cx - r * 0.95, y: y - r * 0.55 }];
    g.strokePoints(p, true);
  };
  [[1, true, 0.02], [0.82, true, 0.08], [0.6, true, 0.12], [0.38, true, 0.1],
   [1, false, -0.02], [0.86, false, -0.08], [0.66, false, -0.12], [0.46, false, -0.1], [0.28, false, -0.06]].forEach(a2 => tri(a2[0], a2[1], a2[2]));
  g.fillStyle(col, a); g.fillCircle(cx, cy, R * 0.03);
  g.strokeRect(cx - R * 1.08, cy - R * 1.08, R * 2.16, R * 2.16);
}

function drawGear(g, cx, cy, R, teeth, col, a) {
  const pts = [];
  for (let i = 0; i < teeth * 2; i++) {
    const a0 = i / (teeth * 2) * TAU, a1 = (i + 1) / (teeth * 2) * TAU, r = i % 2 ? R * 0.82 : R;
    pts.push({ x: cx + Math.cos(a0) * r, y: cy + Math.sin(a0) * r }, { x: cx + Math.cos(a1) * r, y: cy + Math.sin(a1) * r });
  }
  g.fillStyle(col, a); g.fillPoints(pts, true);
  g.lineStyle(2, 0x000000, a * 0.6); g.strokePoints(pts, true);
  g.fillStyle(0x000000, a * 0.55); g.fillCircle(cx, cy, R * 0.42);
  g.lineStyle(3, col, a); g.strokeCircle(cx, cy, R * 0.6);
  for (let i = 0; i < 6; i++) { const an = i / 6 * TAU; g.lineBetween(cx + Math.cos(an) * R * 0.42, cy + Math.sin(an) * R * 0.42, cx + Math.cos(an) * R * 0.6, cy + Math.sin(an) * R * 0.6); }
}

function jharokhaPts(x, y, w, h, ah) {
  const V = Phaser.Math.Vector2;
  const left = new Phaser.Curves.CubicBezier(new V(x, y + ah), new V(x, y + ah * 0.35), new V(x + w * 0.38, y + ah * 0.42), new V(x + w / 2, y));
  const right = new Phaser.Curves.CubicBezier(new V(x + w / 2, y), new V(x + w * 0.62, y + ah * 0.42), new V(x + w, y + ah * 0.35), new V(x + w, y + ah));
  const pts = [{ x: x, y: y + h }];
  left.getPoints(22).forEach(p => pts.push({ x: p.x, y: p.y }));
  right.getPoints(22).forEach(p => pts.push({ x: p.x, y: p.y }));
  pts.push({ x: x + w, y: y + h });
  return pts;
}

function drawJharokha(g, x, y, w, h, o) {
  o = o || {};
  const ah = o.ah || Math.min(w * 0.3, h * 0.35);
  const stroke = o.stroke || C.gold, accent = o.accent || C.saffron;
  const P = jharokhaPts(x, y, w, h, ah);
  g.fillStyle(o.fill !== undefined ? o.fill : C.indigo, o.fillAlpha !== undefined ? o.fillAlpha : 0.86);
  g.fillPoints(P, true);
  g.lineStyle(o.lw || 3, stroke, 1); g.strokePoints(P, true);
  const i = o.inset || 9;
  g.lineStyle(1.5, accent, 0.75);
  g.strokePoints(jharokhaPts(x + i, y + i * 1.8, w - 2 * i, h - i * 2.8, ah * 0.9), true);
  g.fillStyle(stroke, 1);
  g.fillCircle(x + w / 2, y - 7, 5);
  g.fillTriangle(x + w / 2 - 4, y - 10, x + w / 2 + 4, y - 10, x + w / 2, y - 24);
  g.fillCircle(x, y + ah, 4); g.fillCircle(x + w, y + ah, 4);
  g.fillStyle(stroke, 0.9); g.fillRect(x - 6, y + h - 3, w + 12, 6);
  g.fillStyle(accent, 0.9);
  for (let k = 0; k < 9; k++) {
    const px = x + w * (k + 0.5) / 9;
    g.fillPoints([{ x: px, y: y + h - 9 }, { x: px + 4, y: y + h - 5 }, { x: px, y: y + h - 1 }, { x: px - 4, y: y + h - 5 }], true);
  }
}

function drawGlass(g, x, y, w, h, r, col) {

  g.lineStyle(1.5, 0xffffff, 0.25); g.strokeRoundedRect(x + 3, y + 3, w - 6, h - 6, r - 3);

// Phaser re-tessellates every Graphics object on every frame, so heavy static art is
// rendered once into a texture at device-pixel resolution and shown as a plain image.
let bakeSeq = 0;
function bakeRegion(scene, gfx, x, y, w, h, depth) {
  const key = '__bake' + (bakeSeq++);
  const tex = scene.textures.addDynamicTexture(key, Math.ceil(w * DPR), Math.ceil(h * DPR));
  (Array.isArray(gfx) ? gfx : [gfx]).forEach(g => {
    g.setScale(DPR).setPosition((g.x - x) * DPR, (g.y - y) * DPR);
    tex.draw(g, 0, 0);
    g.destroy();
  });
  const img = scene.add.image(x, y, key).setOrigin(0, 0).setScale(1 / DPR);
  if (depth !== undefined) img.setDepth(depth);
  img.once('destroy', () => { if (scene.textures.exists(key)) scene.textures.remove(key); });
  return img;
}

function drawBackdrop(scene, frame) {
  const key = 'backdrop_' + Settings.theme + (frame === false ? '_bare' : '_framed');
  if (!scene.textures.exists(key)) {
    const g = scene.make.graphics({ x: 0, y: 0, add: false });
    paintBackdrop(g, frame);
    g.setScale(DPR);
    scene.textures.addDynamicTexture(key, W * DPR, H * DPR).draw(g, 0, 0);
    g.destroy();
  }
  return scene.add.image(0, 0, key).setOrigin(0, 0).setScale(1 / DPR).setDepth(0);
}
function paintBackdrop(g, frame) {
  const T = theme();
  g.fillStyle(T.bg, 1); g.fillRect(0, 0, W, H);
  g.lineStyle(1, T.lattice, 1);
  for (let k = -H; k < W; k += 40) { g.lineBetween(k, 0, k + H, H); g.lineBetween(k + H, 0, k, H); }
  g.fillStyle(T.dot, 1);
  for (let x = 0; x <= W; x += 40) for (let y = 0; y <= H; y += 40) g.fillCircle(x + 20, y, 1.5);
  if (frame !== false) {
    g.lineStyle(3, T.frame, 0.85); g.strokeRect(10, 10, W - 20, H - 20);
    g.lineStyle(1.5, Settings.theme === 'light' ? C.turquoise : C.terracotta, 0.8); g.strokeRect(18, 18, W - 36, H - 36);
    g.fillStyle(Settings.theme === 'light' ? C.marigold : C.saffron, 0.85);
    for (let x = 30; x < W - 20; x += 26) {
      g.fillTriangle(x - 5, 18, x + 5, 18, x, 26);
      g.fillTriangle(x - 5, H - 18, x + 5, H - 18, x, H - 26);
    }
    [[30, 30], [W - 30, 30], [30, H - 30], [W - 30, H - 30]].forEach(p =>
      drawMandala(g, p[0], p[1], 18, [C.gold, C.saffron, C.terracotta, C.ivory], 8, 1));
  }
  return g;
}

function addRunes(scene, n, depth) {
  const glyphs = ['ॐ', 'श्री', 'चक्र', 'माया', 'अग्नि', 'काल', 'प्राण', 'अमृत', 'धर्म', 'मोक्ष', '◈', '✦', '⟡', '᳀'];
  const cols = Settings.theme === 'light' ? [C.terracotta, C.turquoise, 0xb8740f] : [C.gold, C.saffron, C.emerald];
  for (let i = 0; i < n; i++) {
    const x = Phaser.Math.Between(30, W - 30), y = Phaser.Math.Between(80, H - 10);
    const t = scene.add.text(x, y, Phaser.Utils.Array.GetRandom(glyphs), {
      fontFamily: FONT_DEV, fontSize: Phaser.Math.Between(14, 30) + 'px', color: hex(Phaser.Utils.Array.GetRandom(cols))
    }).setOrigin(0.5).setAlpha(0).setDepth(depth || 1);
    const dur = Phaser.Math.Between(6000, 11000), delay = Phaser.Math.Between(0, 6000);
    scene.tweens.add({ targets: t, y: y - Phaser.Math.Between(80, 180), duration: dur, delay, repeat: -1,
      onRepeat: () => { t.x = Phaser.Math.Between(30, W - 30); } });
    scene.tweens.add({ targets: t, alpha: 0.33, duration: dur / 2, delay, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });
  }
}

function addDiya(scene, x, y, depth, s) {
  s = s || 1; depth = depth || 2;

  scene.tweens.add({ targets: glow, alpha: { from: 0.38, to: 0.75 }, scale: { from: 0.8 * s, to: 1.05 * s },
    duration: Phaser.Math.Between(450, 900), yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });
  const g = scene.add.graphics().setDepth(depth);

  const fl = scene.add.image(x, y - 2 * s, 'fire').setTint(C.gold).setBlendMode('ADD').setOrigin(0.5, 0.95).setScale(0.42 * s).setDepth(depth);
  scene.tweens.add({ targets: fl, scaleY: { from: 0.36 * s, to: 0.5 * s }, scaleX: { from: 0.44 * s, to: 0.38 * s },

  }).setDepth(depth);
}

function makeButton(scene, x, y, w, h, label, cb, col) {
  col = col || C.saffron;
  const c = scene.add.container(x, y);

  const t = scene.add.text(0, 1, label, { fontFamily: FONT, fontSize: Math.round(h * 0.4) + 'px', color: '#0B0C10', fontStyle: 'bold' }).setOrigin(0.5);
  const r = h / 2;
  const draw = hover => {
    g.clear();
    g.fillStyle(hover ? C.gold : c.col, 1); g.fillRoundedRect(-w / 2, -h / 2, w, h, r);
    g.lineStyle(3, C.gold, 1); g.strokeRoundedRect(-w / 2, -h / 2, w, h, r);
    g.lineStyle(1.5, C.indigo, 0.55); g.strokeRoundedRect(-w / 2 + 5, -h / 2 + 5, w - 10, h - 10, r - 5);
    g.fillStyle(C.indigo, 0.6);
    g.fillPoints([{ x: -w / 2 + 16, y: -5 }, { x: -w / 2 + 21, y: 0 }, { x: -w / 2 + 16, y: 5 }, { x: -w / 2 + 11, y: 0 }], true);
    g.fillPoints([{ x: w / 2 - 16, y: -5 }, { x: w / 2 - 11, y: 0 }, { x: w / 2 - 16, y: 5 }, { x: w / 2 - 21, y: 0 }], true);
  };
  c.col = col;
  draw(false);
  c.add([g, t]);
  c.setSize(w, h);
  c.setInteractive({ useHandCursor: true });
  c.on('pointerover', () => { draw(true); scene.tweens.add({ targets: c, scale: 1.06, duration: 120 }); AudioFX.hover(); });

}

function floatText(scene, x, y, str, color, size) {
  const t = scene.add.text(x, y, str, {
    fontFamily: FONT, fontSize: (size || 22) + 'px', color: color || '#F4D03F', fontStyle: 'bold',
    stroke: '#0B0C10', strokeThickness: 5

const keycapWidth = label => Math.max(32, label.length * 10 + 14);
function drawKeycap(g, scene, x, y, label, col, w) {
  w = w || keycapWidth(label);
  g.fillStyle(0x000000, 0.5); g.fillRoundedRect(x - w / 2 + 2, y - 15, w, 32, 6);
  g.fillStyle(C.ink, 1); g.fillRoundedRect(x - w / 2, y - 17, w, 32, 6);
  g.lineStyle(2, col, 1); g.strokeRoundedRect(x - w / 2, y - 17, w, 32, 6);
  return scene.add.text(x, y - 1, label, {
    fontFamily: FONT, fontSize: label.length > 2 ? '12px' : '16px', color: hex(col), fontStyle: 'bold'
  }).setOrigin(0.5);
}

function drawKeyRow(g, scene, cx, y, groups, col, depth) {
  const gap = 6, groupGap = 24;
  const widths = groups.map(gr => gr.reduce((s, k) => s + keycapWidth(k), 0) + gap * (gr.length - 1));
  let x = cx - (widths.reduce((s, w) => s + w, 0) + groupGap * (groups.length - 1)) / 2;
  const out = [];
  groups.forEach((gr, gi) => {
    gr.forEach(k => {
      const w = keycapWidth(k);
      out.push(drawKeycap(g, scene, x + w / 2, y, k, col, w).setDepth(depth));
      x += w + gap;
    });
    x += groupGap - gap;
    if (gi < groups.length - 1) { g.fillStyle(C.gold, 0.7); g.fillCircle(x - groupGap / 2, y - 1, 2.5); }
  });
  return out;
}

// high-impact "ROLES & CONTROLS SWAPPED!" ribbon that sweeps in from the left
function swapBanner(scene, y, sub, depth) {
  const c = scene.add.container(-W / 2, y).setDepth(depth || 57);
  const g = scene.add.graphics();
  const bw = 900, bh = 78;
  const para = (inset, dx, dy) => [
    { x: -bw / 2 + 24 + inset + dx, y: -bh / 2 + inset + dy }, { x: bw / 2 + 24 - inset + dx, y: -bh / 2 + inset + dy },
    { x: bw / 2 - 24 - inset + dx, y: bh / 2 - inset + dy }, { x: -bw / 2 - 24 + inset + dx, y: bh / 2 - inset + dy }];
  g.fillStyle(0x000000, 0.5); g.fillPoints(para(0, 8, 8), true);
  g.fillStyle(C.terracotta, 1); g.fillPoints(para(0, 0, 0), true);
  g.fillStyle(C.saffron, 1); g.fillPoints(para(7, 0, 0), true);
  g.lineStyle(3, C.gold, 1); g.strokePoints(para(0, 0, 0), true);
  g.lineStyle(1.5, C.indigo, 0.5); g.strokePoints(para(11, 0, 0), true);
  g.fillStyle(C.indigo, 0.85);
  for (let i = 0; i < 3; i++) {
    const lx = -bw / 2 + 40 + i * 20, rx = bw / 2 - 40 - i * 20;
    g.fillTriangle(lx, -14, lx + 12, 0, lx, 14);
    g.fillTriangle(rx, -14, rx - 12, 0, rx, 14);
  }
  const shine = scene.add.image(-bw / 2, 0, 'glow').setScale(1.3, 0.75).setBlendMode('ADD').setAlpha(0.85);
  const t = scene.add.text(0, -8, 'ROLES & CONTROLS SWAPPED!', {
    fontFamily: FONT, fontSize: '38px', color: '#0B0C10', fontStyle: 'bold', stroke: '#F4D03F', strokeThickness: 2
  }).setOrigin(0.5);
  const s = scene.add.text(0, 24, sub, { fontFamily: FONT, fontSize: '14px', color: '#2a0d06', fontStyle: 'bold' }).setOrigin(0.5);
  c.add([g, shine, t, s]);
  scene.tweens.add({ targets: c, x: W / 2, duration: 480, ease: 'Back.easeOut' });
  scene.tweens.add({ targets: shine, x: bw / 2, duration: 650, delay: 450, repeat: 2, repeatDelay: 900 });
  scene.tweens.add({ targets: t, scale: { from: 1.3, to: 1 }, duration: 320, delay: 460, ease: 'Back.easeOut' });
  scene.time.delayedCall(470, () => scene.cameras.main.shake(180, 0.006));
  AudioFX.swap();
  return c;
}

// one limb = two bones; angles are measured from straight down, positive swings toward +x
function limb(g, x, y, a1, l1, a2, l2, w1, w2, c1, c2) {
  const kx = x + Math.sin(a1) * l1, ky = y + Math.cos(a1) * l1;
  const ex = kx + Math.sin(a2) * l2, ey = ky + Math.cos(a2) * l2;
  g.lineStyle(w1, c1, 1); g.lineBetween(x, y, kx, ky); g.fillStyle(c1, 1); g.fillCircle(x, y, w1 / 2); g.fillCircle(kx, ky, w1 / 2);
  g.lineStyle(w2, c2, 1); g.lineBetween(kx, ky, ex, ey); g.fillStyle(c2, 1); g.fillCircle(ex, ey, w2 / 2);
  return { kx, ky, ex, ey };
}

function drawWarrior(g, p) {

function quadPts(p0, p1, p2, n) {
  const out = [];
  for (let i = 0; i <= n; i++) {
    const t = i / n, a = (1 - t) * (1 - t), b = 2 * (1 - t) * t, c = t * t;
    out.push({ x: a * p0.x + b * p1.x + c * p2.x, y: a * p0.y + b * p1.y + c * p2.y });
  }
  return out;
}

class Rig {
  constructor(scene, kind, x, y, scale, depth, opts) {
    opts = opts || {};
    this.scene = scene; this.kind = kind; this.scale = scale;
    this.t = Math.random() * 10; this.phase = 0; this.run = 0; this.face = 1; this.castT = -1; this.reflect = false;
    this.c = scene.add.container(x, y).setDepth(depth);
    this.shadow = scene.add.image(0, 0, 'shadow').setScale(kind === 'warrior' ? 0.42 : 0.62, kind === 'warrior' ? 0.2 : 0.24).setAlpha(theme().shadow);
    this.refl = scene.add.graphics().setScale(1, -0.55).setAlpha(0);
    this.g = scene.add.graphics();
    this.c.add([this.shadow, this.refl, this.g]);
    if (kind === 'warrior') {
      this.hilt = scene.add.image(-2.5, -24, 'glow').setTint(C.gold).setBlendMode('ADD').setScale(0.12).setAlpha(0.7);
      this.c.add(this.hilt);
    } else {
      this.eyes = [-4.6, 4.6].map(x2 => scene.add.image(x2, -77, 'glow').setTint(0xffa000).setBlendMode('ADD').setScale(0.12).setAlpha(0.9));
      this.tilak = scene.add.image(0, -81, 'glow').setTint(0xff4d1a).setBlendMode('ADD').setScale(0.16).setAlpha(0.9);
      this.clapFlash = scene.add.image(0, -100, 'glow').setTint(C.gold).setBlendMode('ADD').setScale(0.2).setAlpha(0);
      this.c.add(this.eyes.concat([this.tilak, this.clapFlash]));
      if (!opts.noSmoke) {
        this.smoke = scene.add.particles(0, 0, 'dot', {
          speedY: { min: -50, max: -20 }, speedX: { min: -12, max: 12 }, lifespan: 1100,
          scale: { start: 0.9 * scale, end: 0.1 }, alpha: { start: 0.55, end: 0 },
          tint: [0x1a1014, 0x2b1a20, 0xff5a1a, C.gold], frequency: 70 / Settings.particles(),
          emitZone: { type: 'random', source: new Phaser.Geom.Rectangle(-18 * scale, -70 * scale, 36 * scale, 8 * scale) }
        }).setDepth(depth - 0.1);
        this.smoke.startFollow(this.c);
      }
    }
    this.c.setScale(scale);
    this.draw();
  }
  slam() { this.castT = 0; }
  update(dt, vx, vy) {
    this.t += dt;
    if (this.kind === 'warrior') {
      const sp = Math.hypot(vx || 0, vy || 0);
      const target = Math.min(1.3, sp / RUNNER_SPEED);
      this.run += (target - this.run) * Math.min(1, dt * 10);
      this.phase += dt * (6 + 8 * this.run) * (this.run > 0.05 ? 1 : 0);
      if (Math.abs(vx || 0) > 8) this.face = vx > 0 ? 1 : -1;
      this.c.setScale(this.scale * this.face, this.scale);
      this.c.rotation = this.face * this.run * 0.07;
      this.hilt.setAlpha(0.45 + 0.35 * Math.sin(this.t * 4));
    } else {
      if (this.castT >= 0) { this.castT += dt; if (this.castT > 0.75) this.castT = -1; }
      if (this.castT >= 0.2 && this.castT < 0.2 + dt + 0.001) { this.clapFlash.setAlpha(1).setScale(0.5); this.scene.tweens.add({ targets: this.clapFlash, alpha: 0, scale: 0.15, duration: 380 }); }
      const pulse = 0.75 + 0.25 * Math.sin(this.t * 6);
      this.eyes.forEach(e => e.setAlpha(pulse)); this.tilak.setAlpha(0.6 + 0.4 * Math.sin(this.t * 3.3));
      const bob = Math.sin(this.t * 1.6) * 3 - 4;
      this.eyes.forEach(e => { e.y = -77 + bob; }); this.tilak.y = -81.5 + bob; this.clapFlash.y = -100 + bob;
    }
    this.draw();
  }
  slamAmount() {
    const c = this.castT;
    if (c < 0) return 0;
    return c < 0.2 ? c / 0.2 : Math.max(0, 1 - (c - 0.2) / 0.55);
  }
  draw() {
    this.g.clear();
    const pose = { t: this.t, run: this.run, phase: this.phase, slam: this.slamAmount() };
    if (this.kind === 'warrior') drawWarrior(this.g, pose); else drawRakshasa(this.g, pose);
    if (this.reflect) { this.refl.clear(); drawWarrior(this.refl, pose); }
  }
  setReflect(on, a) {
    this.reflect = on;
    this.refl.setAlpha(on ? (a || 0.2) : 0);
    if (!on) this.refl.clear();
  }
  destroy() { if (this.smoke) this.smoke.destroy(); this.c.destroy(); }
}

function clashIntro(scene, L, R, onDone) {
  const root = scene.add.container(0, 0).setDepth(75);
  const lp = scene.add.container(-W, 0), rp = scene.add.container(W, 0);
  const lg = scene.add.graphics(), rg = scene.add.graphics();
  const lPoly = [{ x: 0, y: 0 }, { x: W / 2 + 90, y: 0 }, { x: W / 2 - 90, y: H }, { x: 0, y: H }];
  const rPoly = [{ x: W / 2 + 90, y: 0 }, { x: W, y: 0 }, { x: W, y: H }, { x: W / 2 - 90, y: H }];
  lg.fillStyle(0x5a2600, 0.97); lg.fillPoints(lPoly, true);
  lg.fillStyle(C.saffron, 0.22);
  for (let i = 0; i < 12; i++) lg.fillPoints([{ x: i * 70 - 200, y: 0 }, { x: i * 70 - 170, y: 0 }, { x: i * 70 - 330, y: H }, { x: i * 70 - 360, y: H }], true);
  drawMandala(lg, 300, 380, 300, [C.gold, C.saffron, 0x7a3a00, C.ivory], 16, 0.25);
  rg.fillStyle(0x2a0408, 0.97); rg.fillPoints(rPoly, true);
  rg.fillStyle(0x000000, 0.35);
  for (let i = 0; i < 12; i++) rg.fillPoints([{ x: W / 2 + i * 70, y: 0 }, { x: W / 2 + i * 70 + 30, y: 0 }, { x: W / 2 + i * 70 - 130, y: H }, { x: W / 2 + i * 70 - 160, y: H }], true);
  drawMandala(rg, 980, 380, 300, [C.terracotta, 0x7a0f14, 0x1a0508, C.gold], 12, 0.3);
  const lRig = new Rig(scene, 'warrior', 310, 610, 6, 0, { noSmoke: true });
  const rRig = new Rig(scene, 'rakshasa', 975, 640, 4.1, 0, { noSmoke: true });
  const txt = (x, y, s, size, col, extra) => scene.add.text(x, y, s, Object.assign({ fontFamily: FONT, fontSize: size + 'px', color: col, fontStyle: 'bold', stroke: '#0B0C10', strokeThickness: 6 }, extra || {})).setOrigin(0.5);
  lp.add([lg, lRig.c, txt(300, 132, L.name, 42, '#FFD27A'), txt(300, 180, L.sub, 18, '#F6E7C1')]);
  rp.add([rg, rRig.c, txt(985, 132, R.name, 36, '#FF6B4A'), txt(985, 180, R.sub, 18, '#F6E7C1')]);
  const div = scene.add.graphics();
  div.lineStyle(8, C.gold, 1); div.lineBetween(W / 2 + 90, 0, W / 2 - 90, H);
  div.lineStyle(2, 0xffffff, 0.8); div.lineBetween(W / 2 + 90, 0, W / 2 - 90, H);
  div.setAlpha(0);
  const top = txt(640, 52, 'WARRIOR   VS   RAKSHASA', 26, '#F4D03F').setAlpha(0);
  const vs = txt(640, 370, 'VS', 120, '#F4D03F', { strokeThickness: 10, shadow: { offsetX: 0, offsetY: 0, color: '#FF5A1A', blur: 30, fill: true } }).setAlpha(0);
  const sparks = scene.add.particles(0, 0, 'spark', {
    emitting: false, speed: { min: 150, max: 520 }, lifespan: { min: 400, max: 1000 }, scale: { start: 1.6, end: 0 },
    alpha: { start: 1, end: 0 }, blendMode: 'ADD', tint: [C.gold, C.saffron, 0xff5a1a, C.ivory]
  });
  root.add([lp, rp, div, top, vs, sparks]);
  const onUpdate = (time, delta) => { const dt = Math.min(0.05, delta / 1000); lRig.update(dt, 0, 0); rRig.update(dt, 0, 0); };
  scene.events.on('update', onUpdate);
  scene.tweens.add({ targets: lp, x: 0, duration: 380, ease: 'Back.easeOut' });
  scene.tweens.add({ targets: rp, x: 0, duration: 380, ease: 'Back.easeOut' });
  scene.tweens.add({ targets: [div, top], alpha: 1, duration: 250, delay: 300 });
  AudioFX.tablaRoll(null, 6, 0.06);
  scene.time.delayedCall(650, () => {
    vs.setAlpha(1).setScale(3.2);
    scene.tweens.add({ targets: vs, scale: 1, duration: 260, ease: 'Back.easeOut' });
    scene.cameras.main.shake(260, 0.012);
    scene.cameras.main.flash(160, 255, 210, 120);
    sparks.explode(Math.round(70 * Settings.particles()), 640, 370);
    rRig.slam();
    AudioFX.clap(); AudioFX.gong();
  });
  scene.time.delayedCall(2300, () => {
    scene.tweens.add({ targets: lp, x: -W, duration: 320, ease: 'Back.easeIn' });
    scene.tweens.add({ targets: rp, x: W, duration: 320, ease: 'Back.easeIn' });
    scene.tweens.add({ targets: [div, top, vs], alpha: 0, duration: 250 });
  });
  scene.time.delayedCall(2680, () => {
    scene.events.off('update', onUpdate);
    lRig.destroy(); rRig.destroy();
    root.destroy();
    if (onDone) onDone();
  });
  return root;
}

// ---------------------------------------------------------------------
// CINEMATIC GRADING — blend-mode colour layers + vignette over the world
// ---------------------------------------------------------------------
function buildGrade(scene, depth) {
  (scene._gradeObjs || []).forEach(o => o.destroy());
  const objs = [];
  const B = Phaser.BlendModes;
  const add = (col, a, mode) => objs.push(scene.add.rectangle(W / 2, H / 2, W, H, col, a).setBlendMode(mode).setDepth(depth));
  switch (Settings.grade) {
    case 'royal': add(0xe9c58a, 0.16, B.MULTIPLY); add(0xffcf7a, 0.09, B.SCREEN); break;
    case 'agni': add(0x5fa8b8, 0.26, B.MULTIPLY); add(0xff7a2a, 0.11, B.SCREEN); break;
    case 'contrast': add(0x5a5a68, 0.3, B.MULTIPLY); add(0x303030, 0.5, B.ADD); break;
  }
  const v = scene.add.image(W / 2, H / 2, 'vignette').setDisplaySize(W, H).setDepth(depth + 0.1)
    .setAlpha((Settings.theme === 'light' ? 0.28 : 0.6) * (Settings.quality === 'ultra' ? 1.15 : 1));
  objs.push(v);
  scene._gradeObjs = objs;
  return objs;
}

class OverlayMenu {
  // o: { inGame, page, onClose, onResume, onRestart, onExit, onQuit, onVisual, onBinds, restartLabel, canRestart }
  constructor(scene, o) {
    this.scene = scene; this.o = o || {}; this.capture = null;
    this.root = scene.add.container(0, 0).setDepth(90);
    const dim = scene.add.rectangle(W / 2, H / 2, W, H, 0x000000, 0.55).setInteractive();
    this.panelG = scene.add.graphics();
    this.page = scene.add.container(0, 0);
    this.root.add([dim, this.panelG, this.page]);
    this.root.setAlpha(0);
    scene.tweens.add({ targets: this.root, alpha: 1, duration: 160 });
    this.keyFn = e => this.onCapture(e);
    window.addEventListener('keydown', this.keyFn, true);
    this.show(this.o.page || (this.o.inGame ? 'pause' : 'settings'));
  }
  destroy() {
    window.removeEventListener('keydown', this.keyFn, true);
    this.root.destroy();
  }
  close() { this.destroy(); if (this.o.onClose) this.o.onClose(); }
  // ESC inside the menu steps back a page (or resumes from the top page)
  back() {
    if (this.capture) { this.capture = null; this.show('controls'); return; }
    if (this.current === 'pause') { if (this.o.onResume) this.o.onResume(); return; }
    if (this.current === 'settings' || this.current === 'controls') {
      if (this.current === 'controls') { this.show('settings'); return; }
      if (this.o.inGame) this.show('pause'); else this.close();
    }
  }
  onCapture(e) {
    if (!this.capture) return;
    e.preventDefault(); e.stopImmediatePropagation();
    if (e.key === 'Escape') { this.capture = null; this.show('controls'); return; }
    const { p, a } = this.capture;
    const clash = Settings.bind(p, a, e.keyCode, keyLabel(e));
    this.capture = null;
    AudioFX.click();
    this.show('controls');
    if (clash) this.toast('Swapped with ' + (clash[0] === 'p1' ? 'Player 1' : 'Player 2') + ' · ' + ACTIONS.find(x => x[0] === clash[1])[1]);
    if (this.o.onBinds) this.o.onBinds();
  }
  toast(s) {
    if (!this.root.scene) return;
    const t = this.scene.add.text(W / 2, 34, s, { fontFamily: FONT, fontSize: '15px', color: '#F4D03F', fontStyle: 'bold', stroke: '#0B0C10', strokeThickness: 4 }).setOrigin(0.5);
    this.page.add(t);
    this.scene.tweens.add({ targets: t, alpha: 0, delay: 1800, duration: 500, onComplete: () => t.destroy() });
  }
  frame(h, title, dev) {
    const g = this.panelG; g.clear();
    const y = (H - h) / 2;
    drawGlass(g, 300, y, 680, h, 22, C.gold);
    g.lineStyle(1, C.gold, 0.35); g.lineBetween(340, y + 92, 940, y + 92);
    drawMandala(g, 340, y + 40, 18, [C.gold, C.saffron, C.terracotta, C.ivory], 8, 0.9);
    drawMandala(g, 940, y + 40, 18, [C.gold, C.saffron, C.terracotta, C.ivory], 8, 0.9);
    this.page.add(this.scene.add.text(W / 2, y + 30, dev, { fontFamily: FONT_DEV, fontSize: '20px', color: '#F4D03F' }).setOrigin(0.5));
    this.page.add(this.scene.add.text(W / 2, y + 64, title, { fontFamily: FONT, fontSize: '28px', color: '#FF9933', fontStyle: 'bold' }).setOrigin(0.5));
    return y;
  }
  pill(x, y, w, label, on, cb, col) {
    const g = this.scene.add.graphics();
    const draw = hover => {
      g.clear();
      g.fillStyle(on ? (col || C.gold) : 0x1a1e2e, on ? 1 : 0.9); g.fillRoundedRect(x - w / 2, y - 16, w, 32, 16);
      g.lineStyle(1.5, on ? C.saffron : (hover ? C.gold : 0x5a5240), 1); g.strokeRoundedRect(x - w / 2, y - 16, w, 32, 16);
    };
    draw(false);
    const t = this.scene.add.text(x, y, label, { fontFamily: FONT, fontSize: '14px', color: on ? '#0B0C10' : '#F6E7C1', fontStyle: 'bold' }).setOrigin(0.5);
    const z = this.scene.add.zone(x, y, w, 32).setInteractive({ useHandCursor: true });
    z.on('pointerover', () => { draw(true); AudioFX.hover(); });
    z.on('pointerout', () => draw(false));
    z.on('pointerdown', () => { AudioFX.init(); AudioFX.click(); cb(); });
    this.page.add([g, t, z]);
  }
  label(x, y, s, col, size) {
    const t = this.scene.add.text(x, y, s, { fontFamily: FONT, fontSize: (size || 16) + 'px', color: col || '#F6E7C1', fontStyle: 'bold' }).setOrigin(0, 0.5);

let Match = null;
// kind: 'local' | 'online' | 'solo'
function newMatch(stageIdx, mode, kind, diff) {
  const order = mode === 'tour' ? [0, 1, 2].map(i => (stageIdx + i) % 3) : [stageIdx];
  const rounds = [];
  let r = 0;
  order.forEach(s => { rounds.push({ stage: s, runner: r % 2 }); r++; rounds.push({ stage: s, runner: r % 2 }); r++; });
  const mk = (name, col) => ({ name, col, total: 0, runs: 0, escapes: 0, relics: 0, traps: 0, best: 0, casts: 0, caused: 0 });
  const p2name = kind === 'solo' ? 'AI ' + BOT_DIFF[diff || 'medium'].name : 'Player 2';
  Match = { mode, kind: kind || 'local', diff: diff || 'medium', stageIdx, rounds, current: 0, results: [],
    players: [mk(kind === 'solo' ? 'You' : 'Player 1', C.saffron), mk(p2name, C.emerald)] };
}
const youTag = idx => (Net.online && idx === Net.me()) ? ' (YOU)' : '';

// ---------------------------------------------------------------------
// LAUNCH — the Swarna Dwar (golden temple doors) unlock and swing open
// onto the main menu, with conch and tabla
// ---------------------------------------------------------------------
class LaunchScene extends Phaser.Scene {
  constructor() { super('Launch'); }
  create() {
    fitCam(this);
    this.scene.launch('Title', { behindDoors: true });
    this.scene.bringToTop();
    this.phase = 'closed';
    // opaque backing so not a single pixel of the menu shows while the gates are shut
    this.backing = this.add.rectangle(W / 2, H / 2, W, H, 0x2a1a04, 1).setDepth(0);
    this.light = this.add.image(W / 2, H / 2, 'glow').setScale(2.5, 7).setTint(0xfff0b0).setBlendMode('ADD').setAlpha(0).setDepth(1);
    // both doors are drawn in their own 0..W/2 space (no negative coordinates), then placed side by side
    const lg = this.add.graphics(), rg = this.add.graphics();
    this.drawDoor(lg, true); this.drawDoor(rg, false);
    this.left = this.add.container(0, 0).setDepth(2);
    this.right = this.add.container(W / 2, 0).setDepth(2);
    this.left.add(bakeRegion(this, lg, 0, 0, W / 2, H));
    this.right.add(bakeRegion(this, rg, 0, 0, W / 2, H));
    this.bars = [250, 470].map(y => [
      this.add.rectangle(W / 2 - 70, y, 140, 26, C.gold).setStrokeStyle(3, 0x6b4a08).setDepth(3),
      this.add.rectangle(W / 2 + 70, y, 140, 26, C.gold).setStrokeStyle(3, 0x6b4a08).setDepth(3)
    ]);
    this.sealGlow = this.add.image(W / 2, H / 2, 'glow').setTint(C.gold).setBlendMode('ADD').setScale(3.2).setAlpha(0.35).setDepth(4);
    this.seal = this.add.image(W / 2, H / 2, 'chakra').setScale(0.95).setDepth(4);
    this.tweens.add({ targets: this.seal, angle: 360, duration: 24000, repeat: -1 });
    this.tweens.add({ targets: this.sealGlow, alpha: 0.6, scale: 3.6, duration: 1200, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });
    this.header = this.add.text(W / 2, 64, 'स्वर्ण द्वार', { fontFamily: FONT_DEV, fontSize: '34px', color: '#FFF0B0', stroke: '#5a3a00', strokeThickness: 4 }).setOrigin(0.5).setDepth(7);
    this.prompt = this.add.text(W / 2, 664, 'Press any key or click to unseal the Swarna Dwar', {
      fontFamily: FONT, fontSize: '22px', color: '#FFF0B0', fontStyle: 'bold', stroke: '#3a2400', strokeThickness: 4
    }).setOrigin(0.5).setDepth(7);
    this.pills = [this.labelPill(this.header), this.labelPill(this.prompt)];
    this.tweens.add({ targets: this.prompt, alpha: 0.55, duration: 800, yoyo: true, repeat: -1 });
    this.petals = this.add.particles(0, 0, 'petal', {
      emitting: false, speed: { min: 180, max: 620 }, angle: { min: 0, max: 360 }, gravityY: 260, rotate: { min: 0, max: 360 },
      lifespan: { min: 1400, max: 2600 }, scale: { min: 0.8, max: 1.6 }, tint: [C.marigold, C.saffron, 0xff5a1a, 0xffd34d], alpha: { start: 1, end: 0.2 }
    }).setDepth(5);
    this.sparks = this.add.particles(0, 0, 'spark', {
      emitting: false, speed: { min: 200, max: 700 }, lifespan: { min: 500, max: 1200 }, scale: { start: 1.6, end: 0 },
      alpha: { start: 1, end: 0 }, blendMode: 'ADD', tint: [C.gold, 0xfff0b0, C.saffron]
    }).setDepth(5);
    this.input.keyboard.on('keydown', e => { if (!e.repeat) this.open(); });
    this.input.on('pointerdown', () => this.open());
  }
  // dark, gold-rimmed pill behind a label so it stays crisp over the carved doors
  labelPill(t) {
    const w = t.width + 64, h = t.height + 20, g = this.add.graphics().setDepth(6);
    g.fillStyle(0x000000, 0.35); g.fillRoundedRect(t.x - w / 2 + 3, t.y - h / 2 + 4, w, h, h / 2);
    g.fillStyle(0x140c02, 0.92); g.fillRoundedRect(t.x - w / 2, t.y - h / 2, w, h, h / 2);
    g.lineStyle(2.5, C.gold, 1); g.strokeRoundedRect(t.x - w / 2, t.y - h / 2, w, h, h / 2);
    g.lineStyle(1, 0xFFE08A, 0.45); g.strokeRoundedRect(t.x - w / 2 + 5, t.y - h / 2 + 5, w - 10, h - 10, (h - 10) / 2);
    return g;
  }
  // one door filling 0..W/2; the seam strip and ring handle sit on the edge that meets the other door
  drawDoor(g, seamOnRight) {
    const w = W / 2, ox = 0;
    g.fillStyle(0x6b4a08, 1); g.fillRect(ox, 0, w, H);
    for (let i = 0; i < 16; i++) { g.fillStyle(i % 2 ? 0xC9971F : 0xB8860B, 1); g.fillRect(ox + 14 + i * ((w - 28) / 16), 14, (w - 28) / 16 + 1, H - 28); }
    g.lineStyle(4, 0xFFE08A, 0.9); g.strokeRect(ox + 18, 18, w - 36, H - 36);
    [[60, 238], [266, 454], [482, 660]].forEach(([y1, y2], k) => {
      const x1 = ox + 56, x2 = ox + w - 56, cx = (x1 + x2) / 2, cy = (y1 + y2) / 2;
      g.fillStyle(0x8a6210, 1); g.fillRect(x1, y1, x2 - x1, y2 - y1);
      g.fillStyle(0xD8A928, 1); g.fillRect(x1 + 8, y1 + 8, x2 - x1 - 16, y2 - y1 - 16);
      g.lineStyle(3, 0xFFF0B0, 0.9); g.lineBetween(x1 + 8, y1 + 8, x2 - 8, y1 + 8); g.lineBetween(x1 + 8, y1 + 8, x1 + 8, y2 - 8);
      g.lineStyle(3, 0x5a3a00, 0.9); g.lineBetween(x1 + 8, y2 - 8, x2 - 8, y2 - 8); g.lineBetween(x2 - 8, y1 + 8, x2 - 8, y2 - 8);
      drawMandala(g, cx, cy, k === 1 ? 74 : 62, [0x6b4a08, 0xFFE08A, 0xB8860B, 0x5a3a00], k === 1 ? 16 : 12, 0.95);
      g.fillStyle(0x5a3a00, 1);
      for (let x = x1 + 20; x <= x2 - 20; x += 28) { g.fillCircle(x, y1 + 18, 4); g.fillCircle(x, y2 - 18, 4); }
      g.fillStyle(0xFFF0B0, 1);
      for (let x = x1 + 20; x <= x2 - 20; x += 28) { g.fillCircle(x - 1, y1 + 17, 1.5); g.fillCircle(x - 1, y2 - 19, 1.5); }
    });
    const seamX = seamOnRight ? w - 8 : 8, ringX = seamOnRight ? w - 70 : 70;
    g.fillStyle(0xFFE08A, 1); g.fillRect(seamX - 6, 0, 12, H);
    g.fillStyle(0x5a3a00, 1); g.fillRect(seamOnRight ? w - 2 : 0, 0, 2, H);
    g.lineStyle(10, 0x5a3a00, 1); g.strokeCircle(ringX, H / 2, 26);
    g.lineStyle(5, 0xFFE08A, 1); g.strokeCircle(ringX, H / 2, 26);
  }
  open() {
    if (this.phase === 'opening') { if (this.time.now - this.openedAt > 500) this.finish(); return; }
    if (this.phase !== 'closed') return;
    this.phase = 'opening';
    this.openedAt = this.time.now;
    AudioFX.init();
    const now = AudioFX.ctx ? AudioFX.ctx.currentTime : 0;
    AudioFX.conch(now + 0.05, 2.5);
    AudioFX.tablaRoll(now + 0.25, 12, 0.075);
    this.tweens.killTweensOf(this.prompt);
    this.tweens.add({ targets: [this.prompt, this.header].concat(this.pills), alpha: 0, duration: 250 });
    this.tweens.killTweensOf(this.seal);
    this.tweens.add({ targets: this.seal, angle: this.seal.angle + 900, duration: 1300, ease: 'Cubic.easeIn' });
    this.tweens.killTweensOf(this.sealGlow);
    this.tweens.add({ targets: this.sealGlow, alpha: 1, scale: 5, duration: 1300, ease: 'Cubic.easeIn' });
    this.cameras.main.shake(1300, 0.003);
    this.bars.forEach((pair, i) => {
      this.tweens.add({ targets: pair[0], x: '-=170', alpha: 0, delay: 650 + i * 120, duration: 450, ease: 'Cubic.easeIn' });
      this.tweens.add({ targets: pair[1], x: '+=170', alpha: 0, delay: 650 + i * 120, duration: 450, ease: 'Cubic.easeIn' });
    });
    this.time.delayedCall(1300, () => {
      this.tweens.killTweensOf(this.seal);
      this.tweens.add({ targets: this.seal, alpha: 0, scale: 1.35, duration: 420, ease: 'Cubic.easeOut' });
      this.tweens.add({ targets: this.sealGlow, alpha: 0, scale: 8, duration: 600 });
      this.cameras.main.flash(300, 255, 240, 190);
      this.cameras.main.shake(450, 0.02);
      this.petals.explode(Math.round(160 * Settings.particles()), W / 2, H / 2);
      this.sparks.explode(Math.round(90 * Settings.particles()), W / 2, H / 2);
      AudioFX.gong(); AudioFX.clap();
      this.light.setAlpha(1);
      // the gates slide apart: left door to -W/2, right door to +W, revealing the menu between them
      this.tweens.add({ targets: this.backing, alpha: 0, duration: 250 });
      this.tweens.add({ targets: this.left, x: -W / 2, duration: 1250, ease: 'Cubic.easeInOut' });
      this.tweens.add({ targets: this.right, x: W, duration: 1250, ease: 'Cubic.easeInOut' });
      this.tweens.add({ targets: this.light, alpha: 0, scaleX: 9, duration: 1500, delay: 300 });
    });
    this.time.delayedCall(2750, () => this.finish());
  }
  finish() {
    if (this.phase === 'done') return;
    this.phase = 'done';
    this.game.events.emit('doors-open');
    this.scene.stop();
  }
}
