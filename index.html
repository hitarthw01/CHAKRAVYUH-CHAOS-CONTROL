    T(370, 318, 'Open a room and share its code.\nYou are Player 1 and choose the battlefield.', 15, '#F6E7C1', { align: 'center', lineSpacing: 4 });
    T(910, 268, 'JOIN GAME', 28, '#00A878', { fontStyle: 'bold' });
    T(910, 318, 'Type the room code shown on the host laptop.\nYou are Player 2.', 15, '#F6E7C1', { align: 'center', lineSpacing: 4 });

    this.codeLabel = T(370, 392, 'ROOM CODE', 14, '#F4D03F', { fontStyle: 'bold' }).setVisible(false);
    this.codeText = T(370, 432, '', 40, '#F4D03F', {
      fontFamily: FONT_MONO, fontStyle: 'bold', shadow: { offsetX: 0, offsetY: 0, color: '#FF9933', blur: 14, fill: true }
    }).setVisible(false);
    this.hostBtn = makeButton(this, 370, 520, 260, 50, 'HOST GAME', () => this.host()).setDepth(5);
    this.copyBtn = makeButton(this, 370, 520, 260, 50, 'COPY CODE', () => this.copy(), C.gold).setDepth(5).setVisible(false);

    this.inputG = this.add.graphics().setDepth(3);
    this.inputText = T(910, 420, '', 36, '#F6E7C1', { fontFamily: FONT_MONO, fontStyle: 'bold' });
    T(910, 466, 'type letters / numbers · Ctrl+V to paste · Backspace to erase', 12, '#F6E7C1').setAlpha(0.6);
    this.joinBtn = makeButton(this, 910, 520, 260, 50, 'JOIN GAME', () => this.join(), C.emerald).setDepth(5);

    this.statusText = T(640, 622, '', 17, ink(), { fontStyle: 'bold' });
    makeButton(this, 640, 674, 200, 44, 'BACK', () => this.back(), C.terracotta).setDepth(5);

    this.caret = true;
    this.time.addEvent({ delay: 450, loop: true, callback: () => { this.caret = !this.caret; this.drawInput(); } });
    this.drawInput();

    // open rooms advertised in the Firebase Realtime Database — click one to join
    this.roomsLabel = T(910, 566, '', 11, '#c9b48a', { fontStyle: 'bold' });
    this.roomChips = [];
    this.unwatchRooms = () => {};
    const watchRooms = () => {
      this.unwatchRooms();
      this.unwatchRooms = FB.watchOpenRooms(list => { if (this.sys.isActive()) this.showRooms(list); });
    };
    watchRooms();
    const offFB = FB.onChange(() => { if (this.sys.isActive() && FB.canRelay() && this.roomChips.length === 0) watchRooms(); });
    this.events.once('shutdown', () => { this.unwatchRooms(); offFB(); });

    if (!Net.available() && !FB.ready) {
      this.status('PeerJS and Firebase could not be loaded — online play needs an internet connection.', '#FF5A3A');
      this.phase = 'disabled';
      this.hostBtn.setAlpha(0.4); this.joinBtn.setAlpha(0.4);
    } else {
      this.status('Choose: host a new room, or join a friend’s room.', ink());
    }

    Net.setHandlers({ full: () => { Net.reset(); this.phase = 'idle'; this.status('That room already has two players.', '#FF5A3A'); } });
    this.input.keyboard.on('keydown', e => this.onKey(e));
    this.pasteFn = e => {
      const txt = (e.clipboardData || window.clipboardData).getData('text');
      if (this.phase === 'idle') this.setCode(txt);
    };
    window.addEventListener('paste', this.pasteFn);
    this.events.once('shutdown', () => window.removeEventListener('paste', this.pasteFn));
  }
  showRooms(list) {
    this.roomChips.forEach(o => o.destroy());
    this.roomChips = [];
    const rooms = list.filter(r => r.code !== Net.code).slice(0, 3);
    this.roomsLabel.setText(rooms.length ? 'OPEN ROOMS (Firebase) — click to join' : (FB.canRelay() ? 'No open rooms right now' : ''));
    rooms.forEach((r, i) => {
      const x = 760 + i * 150, y = 586;
      const g = this.add.graphics().setDepth(3);
      g.fillStyle(C.ink, 1); g.fillRoundedRect(x - 70, y - 12, 140, 24, 12);
      g.lineStyle(1.5, C.emerald, 1); g.strokeRoundedRect(x - 70, y - 12, 140, 24, 12);
      const t = this.add.text(x, y, r.code + ' · ' + r.name.slice(0, 9), { fontFamily: FONT, fontSize: '11px', color: '#F6E7C1', fontStyle: 'bold' }).setOrigin(0.5).setDepth(4);
      const z = this.add.zone(x, y, 140, 24).setInteractive({ useHandCursor: true }).setDepth(4);
      z.on('pointerdown', () => { if (this.phase !== 'idle') return; AudioFX.click(); this.setCode(r.code); this.join(); });
      this.roomChips.push(g, t, z);
    });
  }
  status(s, col) {
    this.statusText.setText(s).setColor(col || ink());
    this.tweens.killTweensOf(this.statusText);
    this.statusText.setAlpha(1);
  }
  drawInput() {
    const g = this.inputG; g.clear();
    const active = this.phase === 'idle';
    g.fillStyle(C.ink, 1); g.fillRoundedRect(720, 386, 380, 66, 12);
    g.lineStyle(2.5, active ? C.emerald : 0x445, 1); g.strokeRoundedRect(720, 386, 380, 66, 12);
    g.lineStyle(1, C.gold, 0.4); g.strokeRoundedRect(726, 392, 368, 54, 9);
    let s = '';
    for (let i = 0; i < 5; i++) s += this.code[i] || (i === this.code.length && this.caret && active ? '▌' : '·');
    this.inputText.setText('CHAKRA-' + s);
  }
  onKey(e) {
    const k = e.key;
    if (k === 'Escape') { this.back(); return; }
    if (this.phase !== 'idle') return;
    if (k === 'Enter') { this.join(); return; }
    if (k === 'Backspace') { this.code = this.code.slice(0, -1); this.drawInput(); return; }
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (/^[a-zA-Z0-9]$/.test(k) && this.code.length < 5) {
      this.code += k.toUpperCase(); AudioFX.hover(); this.drawInput();
    }
  }
  setCode(raw) {
    const s = String(raw || '').toUpperCase().replace(/^.*CHAKRA-?/, '').replace(/[^A-Z0-9]/g, '');
    this.code = s.slice(0, 5);
    this.drawInput();
  }
  host() {
    if (this.phase !== 'idle') return;
    this.phase = 'hosting';
    this.status('Opening a room on the PeerJS network…', '#F4D03F');
    this.drawInput();
    Net.host((ev, data) => {
      if (!this.sys.isActive()) return;
      if (ev === 'code') {
        this.hostBtn.setVisible(false); this.copyBtn.setVisible(true);
        this.codeLabel.setVisible(true);
        this.codeText.setVisible(true).setText('CHAKRA-' + data).setScale(0.4);
        this.tweens.add({ targets: this.codeText, scale: 1, duration: 450, ease: 'Back.easeOut' });
        this.status('Share this code with the other laptop — waiting for your opponent…', '#F4D03F');
        this.tweens.add({ targets: this.statusText, alpha: 0.45, duration: 700, yoyo: true, repeat: -1 });
        AudioFX.beep(true);
      } else if (ev === 'connected') {
        this.connected();
      } else if (ev === 'error') {
        Net.reset();
        this.phase = 'idle';
        this.hostBtn.setVisible(true); this.copyBtn.setVisible(false);
        this.codeLabel.setVisible(false); this.codeText.setVisible(false);
        this.status(data, '#FF5A3A');
        this.drawInput();
      }
    });
  }
  copy() {
    const txt = this.codeText.text;
    try {
      navigator.clipboard.writeText(txt).then(
        () => floatText(this, 370, 480, 'Copied!', '#00A878', 18),
        () => floatText(this, 370, 480, 'Copy blocked — read it out', '#FF9933', 16));
    } catch (e) { floatText(this, 370, 480, 'Copy blocked — read it out', '#FF9933', 16); }
  }
  join() {
    if (this.phase !== 'idle') return;
    if (this.code.length !== 5) { this.status('Enter the 5-character room code first.', '#FF5A3A'); AudioFX.deny(); return; }
    this.phase = 'joining';
    this.drawInput();
    this.status('Connecting to CHAKRA-' + this.code + '…', '#F4D03F');
    this.tweens.add({ targets: this.statusText, alpha: 0.45, duration: 600, yoyo: true, repeat: -1 });
    Net.join(this.code, (ev, data) => {
      if (!this.sys.isActive()) return;
      if (ev === 'connected') this.connected();
      else if (ev === 'status') this.status(data, '#F4D03F');
      else { Net.reset(); this.phase = 'idle'; this.status(data, '#FF5A3A'); this.drawInput(); }
    });
  }
  connected() {
    this.phase = 'connected';
    this.status('Connected via ' + (Net.via === 'relay' ? 'Firebase relay' : 'direct WebRTC') + '! You are Player ' + (Net.me() + 1) + '. Entering the battlefield…', '#00A878');
    AudioFX.portalOpen();
    this.cameras.main.flash(300, 0, 168, 120);
    this.time.delayedCall(1000, () => {
      if (!Net.online) return;
      this.cameras.main.fadeOut(350, 8, 9, 15);
      this.cameras.main.once('camerafadeoutcomplete', () => this.scene.start('Select', { kind: 'online' }));
    });
  }
  back() {
    if (this.leaving) return; this.leaving = true;
    if (Net.online) Net.leave(); else Net.reset();
    this.scene.start('Title');
  }
}

    this.mode = Match ? Match.mode : 'duel';

    this.add.text(640, 46, 'रणभूमि', { fontFamily: FONT_DEV, fontSize: '28px', color: Settings.theme === 'light' ? '#b8740f' : '#F4D03F' }).setOrigin(0.5);
    this.add.text(640, 86, 'CHOOSE YOUR BATTLEFIELD', {
      fontFamily: FONT, fontSize: '36px', color: '#FF9933', fontStyle: 'bold', stroke: '#5a1a10', strokeThickness: 5
    }).setOrigin(0.5);
    const subtitle = {
      online: Net.isHost ? 'ONLINE · You are PLAYER 1 (host) — you pick the stage' : 'ONLINE · You are PLAYER 2 — the host is choosing the battlefield…',
      local: 'LOCAL · Player 1 sits left · Player 2 sits right · keys follow your role',
      solo: 'SOLO · You vs an AI bot that plays BOTH roles as they swap'
    }[this.kind];
    this.add.text(640, 120, subtitle, { fontFamily: FONT, fontSize: '14px', color: this.online ? '#00A878' : ink(), fontStyle: 'bold' }).setOrigin(0.5);

    this.cards = STAGES.map((st, i) => {
      const cx = 250 + i * 390;
      const glow = this.add.image(cx, 355, 'glow').setScale(4.5, 5).setTint(st.pal.accent).setBlendMode('ADD').setAlpha(0);
      const g = this.add.graphics();
      const texts = [
        this.add.text(cx, 404, st.name, { fontFamily: FONT, fontSize: '24px', color: hex(st.pal.accent), fontStyle: 'bold' }).setOrigin(0.5),
        this.add.text(cx, 212, st.dev, { fontFamily: FONT_DEV, fontSize: '22px', color: '#F4D03F' }).setOrigin(0.5),
        this.add.text(cx, 440, st.sub, { fontFamily: FONT, fontSize: '13px', color: '#F6E7C1', align: 'center', wordWrap: { width: 280 } }).setOrigin(0.5),
        this.add.text(cx - 128, 474, st.feats.join('\n'), { fontFamily: FONT, fontSize: '13px', color: '#F6E7C1', lineSpacing: 5 }).setOrigin(0, 0)
      ];
      this.add.text(cx, 152, 'STAGE ' + (i + 1), { fontFamily: FONT, fontSize: '13px', color: '#F4D03F' }).setOrigin(0.5).setDepth(2);
      const zone = this.add.zone(cx, 350, 330, 400).setInteractive({ useHandCursor: this.canEdit });
      zone.on('pointerdown', () => { if (!this.canEdit) return; if (this.sel === i) this.start(); else this.choose(i); });
      zone.on('pointerover', () => AudioFX.hover());
      return { cx, g, glow, texts, st };
    });

    this.modeG = this.add.graphics();
    const rowY = this.kind === 'solo' ? 586 : 600;
    this.rowY = rowY;
    this.modeTexts = [
      this.add.text(470, rowY, 'DUEL  ·  2 ROUNDS', { fontFamily: FONT, fontSize: '16px', fontStyle: 'bold' }).setOrigin(0.5),
      this.add.text(810, rowY, 'GRAND TOUR  ·  6 ROUNDS', { fontFamily: FONT, fontSize: '16px', fontStyle: 'bold' }).setOrigin(0.5)
    ];
    ['duel', 'tour'].forEach((m, i) => {
      const z = this.add.zone(i ? 810 : 470, rowY, 300, 36).setInteractive({ useHandCursor: this.canEdit });
      z.on('pointerdown', () => { if (!this.canEdit) return; this.mode = m; AudioFX.click(); this.changed(); });
    });
    this.diffTexts = [];
    if (this.kind === 'solo') {
      ['easy', 'medium', 'hard'].forEach((d, i) => {
        const x = 400 + i * 240;
        this.diffTexts.push(this.add.text(x, 630, (i + 1) + ' · ' + BOT_DIFF[d].name.toUpperCase() + ' (' + BOT_DIFF[d].tier + ')', { fontFamily: FONT, fontSize: '14px', fontStyle: 'bold' }).setOrigin(0.5));
        const z = this.add.zone(x, 630, 226, 34).setInteractive({ useHandCursor: true });
        z.on('pointerdown', () => { this.diff = d; AudioFX.click(); this.redraw(); });
      });
    }
    this.modeDesc = this.add.text(640, this.kind === 'solo' ? 657 : 632, '', { fontFamily: FONT, fontSize: '13px', color: ink() }).setOrigin(0.5).setAlpha(0.85);

    this.startBtn = makeButton(this, 640, 690, 260, 40, this.canEdit ? 'BEGIN MATCH' : 'WAITING FOR HOST', () => this.start(),
      this.canEdit ? C.saffron : 0x6b5a3a).setDepth(5);
    this.add.text(1250, 706, this.canEdit ? '← → stage  ↑ ↓ match' + (this.kind === 'solo' ? '  1 2 3 AI' : '') + '  ENTER  ESC' : 'ESC leave match', {
      fontFamily: FONT, fontSize: '11px', color: ink()
    }).setOrigin(1, 0.5).setAlpha(0.6);

    const kb = this.input.keyboard;
    const left = () => { if (this.canEdit) this.choose((this.sel + 2) % 3); };
    const right = () => { if (this.canEdit) this.choose((this.sel + 1) % 3); };
    const flip = () => { if (!this.canEdit) return; this.mode = this.mode === 'duel' ? 'tour' : 'duel'; AudioFX.click(); this.changed(); };
    kb.on('keydown-LEFT', left); kb.on('keydown-A', left);
    kb.on('keydown-RIGHT', right); kb.on('keydown-D', right);
    kb.on('keydown-UP', flip); kb.on('keydown-DOWN', flip); kb.on('keydown-W', flip); kb.on('keydown-S', flip);
    if (this.kind === 'solo') ['ONE', 'TWO', 'THREE'].forEach((k, i) => kb.on('keydown-' + k, () => { this.diff = ['easy', 'medium', 'hard'][i]; AudioFX.click(); this.redraw(); }));
    kb.on('keydown-ENTER', () => this.start());
    kb.on('keydown-SPACE', () => this.start());
    kb.on('keydown-ESC', () => this.back());
    kb.on('keydown-M', () => AudioFX.toggleMute());

    if (this.online) {
      if (Net.isHost) {
        Net.setHandlers({ hi: () => this.broadcast() });
        this.broadcast();
      } else {
        Net.setHandlers({
          sel: m => { this.sel = m.sel; this.mode = m.mode; AudioFX.hover(); this.redraw(); },
          match: m => { newMatch(m.stageIdx, m.mode, 'online'); this.go(); }
        });
        Net.send({ t: 'hi' });
      }
    }
    this.redraw();
  }
  broadcast() { if (this.online && Net.isHost) Net.send({ t: 'sel', sel: this.sel, mode: this.mode }); }
  changed() { this.redraw(); this.broadcast(); }
  choose(i) { if (i === this.sel) return; this.sel = i; AudioFX.click(); this.changed(); }
  drawPreview(g, st, x, y, w, h) {
    const P = stagePal(st);
    const s = w / AW, px = v => x + (v - AX) * s, py = v => y + (v - AY) * s;
    g.fillStyle(P.floor, 1); g.fillRect(x, y, w, h);
    g.lineStyle(1, P.line, 0.6);
    for (let k = 0; k <= 24; k++) g.lineBetween(x + k * w / 24, y, x + k * w / 24, y + h);
    st.pools.forEach(r => { g.fillStyle(0x2a8fb0, 0.85); g.fillRect(px(r.x), py(r.y), r.w * s, r.h * s); });
    st.moat.forEach(r => { g.fillStyle(0x0e4f74, 1); g.fillRect(px(r.x), py(r.y), r.w * s, r.h * s); });
    st.bridges.forEach(r => { g.fillStyle(P.wallHi, 1); g.fillRect(px(r.x), py(r.y), r.w * s, r.h * s); });
    st.lava.forEach(r => { g.fillStyle(0xff5a1a, 1); g.fillRect(px(r.x), py(r.y), r.w * s, r.h * s); });
    st.stairs.forEach(r => { g.fillStyle(P.wallHi, 1); g.fillRect(px(r.x), py(r.y), r.w * s, r.h * s); });
    st.walls.forEach(r => { g.fillStyle(P.wall, 1); g.fillRect(px(r.x), py(r.y), r.w * s, r.h * s); });
    st.devils.forEach(d => { g.lineStyle(1.5, 0xe0c08a, 0.7); g.lineBetween(px(d.x1), py(d.y1), px(d.x2), py(d.y2)); });
    st.relics.forEach(r => { g.fillStyle(C.gold, 1); g.fillCircle(px(r.x), py(r.y), 4); });
    g.fillStyle(0xff5a1a, 1); g.fillRect(px(st.kund.x) - 4, py(st.kund.y) - 4, 8, 8);
    g.fillStyle(C.emerald, 1); g.fillCircle(px(st.portal.x), py(st.portal.y), 7);
    g.lineStyle(1.5, C.gold, 1); g.strokeCircle(px(st.portal.x), py(st.portal.y), 7);
    g.fillStyle(C.saffron, 1); g.fillCircle(px(st.spawn.x), py(st.spawn.y), 4);
    g.lineStyle(2, C.gold, 0.9); g.strokeRect(x, y, w, h);
  }
  redraw() {
    this.cards.forEach((c, i) => {
      const on = i === this.sel;
      c.g.clear();
      drawJharokha(c.g, c.cx - 165, 142, 330, 400, {
        stroke: on ? C.gold : 0x6b5a3a, accent: on ? c.st.pal.accent : 0x4a4030, ah: 70, lw: on ? 4 : 2, fillAlpha: 0.92
      });
      this.drawPreview(c.g, c.st, c.cx - 135, 238, 270, 135);
      c.g.setAlpha(on ? 1 : 0.65);
      c.texts.forEach(t => t.setAlpha(on ? 1 : 0.55));
      this.tweens.killTweensOf(c.glow);
      c.glow.setScale(4.5, 5).setAlpha(on ? 0.22 : 0);
      if (on) this.tweens.add({ targets: c.glow, scaleX: 5, scaleY: 5.5, duration: 160, yoyo: true });
    });
    const g = this.modeG; g.clear();
    [['duel', 470], ['tour', 810]].forEach(([m, x], i) => {
      const on = this.mode === m;
      g.fillStyle(on ? C.gold : C.indigo, on ? 1 : 0.85); g.fillRoundedRect(x - 150, this.rowY - 18, 300, 36, 18);
      g.lineStyle(2, on ? C.saffron : 0x6b5a3a, 1); g.strokeRoundedRect(x - 150, this.rowY - 18, 300, 36, 18);
      this.modeTexts[i].setColor(on ? '#0B0C10' : '#F6E7C1');
    });
    if (this.kind === 'solo') {
      ['easy', 'medium', 'hard'].forEach((d, i) => {
        const on = this.diff === d, x = 400 + i * 240;
        g.fillStyle(on ? C.terracotta : C.indigo, on ? 1 : 0.85); g.fillRoundedRect(x - 113, 613, 226, 34, 17);
        g.lineStyle(2, on ? C.gold : 0x6b5a3a, 1); g.strokeRoundedRect(x - 113, 613, 226, 34, 17);
        this.diffTexts[i].setColor(on ? '#FFF4DD' : '#F6E7C1');
      });
    }
    const D = BOT_DIFF[this.diff];
    this.modeDesc.setText(this.kind === 'solo'
      ? { easy: 'Shishya: casts every 7.5s with loose aim · runs at 80% speed, never dashes',
          medium: 'Yodha: casts every 5s aimed at you · navigates obstacles, dashes away from fireballs',
          hard: 'Maharathi: casts on every 5s cooldown with predictive lead-aim · dodges telegraphs, shields, optimal routes' }[this.diff] + '  (' + D.tier + ')'
      : this.mode === 'duel' ? 'One stage · each player runs once · highest total score wins'
        : 'All three stages starting from the pick · roles swap every round · highest total wins');
  }
  start() {
    if (!this.canEdit) { floatText(this, 640, 650, 'Only the host can begin the match', '#FF9933', 16); return; }
    if (this.leaving) return;
    newMatch(this.sel, this.mode, this.kind, this.diff);
    if (this.online) Net.send({ t: 'match', stageIdx: this.sel, mode: this.mode });
    this.go();
  }
  go() {
    if (this.leaving) return; this.leaving = true;
    AudioFX.click();
    this.cameras.main.fadeOut(350, 8, 9, 15);
    this.cameras.main.once('camerafadeoutcomplete', () => this.scene.start('Game'));
  }
  back() {
    if (this.leaving) return; this.leaving = true;
    if (this.online) Net.leave();
    this.scene.start('Title');
  }
}

// ---------------------------------------------------------------------
// GAME — one round. Local/solo: full simulation here. Online: the host
// simulates (authority) and streams snapshots + events; the guest renders
// them and streams its inputs back.
// ---------------------------------------------------------------------
class GameScene extends Phaser.Scene {
  constructor() { super('Game'); }

  create() {
    fitCam(this);
    this.time.paused = false;
    this.physics.resume();
    const R = Match.rounds[Match.current];
    this.stage = STAGES[R.stage];
    this.runnerIdx = R.runner; this.sabIdx = 1 - R.runner;
    this.runnerP = Match.players[this.runnerIdx]; this.sabP = Match.players[this.sabIdx];

    this.kind = Match.kind;
    this.online = this.kind === 'online' && Net.online;
    this.auth = !this.online || Net.isHost;
    this.me = this.online ? Net.me() : (this.kind === 'solo' ? 0 : -1);
    this.localIsRunner = this.me < 0 ? true : this.runnerIdx === this.me;
    this.runScheme = ctrlScheme(this.runnerIdx, 'runner', this.kind);
    this.sabScheme = ctrlScheme(this.sabIdx, 'saboteur', this.kind);

    this.state = 'intro'; this.paused = false; this.ended = false; this.menu = null; this.resumeT = 0;
    this.timeLeft = ROUND_TIME; this.relics = 0; this.traps = 0; this.casts = 0;
    this.cd = { agni: 0, maya: 0, kala: 0 };
    this.dashCd = 0; this.shieldCd = 0; this.dashT = 0; this.iframeT = 0; this.immuneT = 0;
    this.stunT = 0; this.knock = { x: 0, y: 0 }; this.invertT = 0; this.slowT = 0; this.shieldOn = 0;
    this.dashVec = { x: 0, y: 0 }; this.lastMove = { x: 1, y: 0 };
    this.telegraphs = []; this.projectiles = []; this.pillars = []; this.morphT = { agni: 0, maya: 0, kala: 0 };
    this.envT = 0; this.lastTick = 99; this.hintT = 0; this.fastMusic = false;
    this.checkpoint = { x: this.stage.spawn.x, y: this.stage.spawn.y };
    this.portalOpen = false;
    this.remoteIn = { ix: 0, iy: 0 }; this.retTarget = null; this.snap = null;
    this.sentIn = { ix: 9, iy: 9, at: 0 }; this.sentRet = { x: -1, y: -1 };
    this.arenaObjs = []; this.lightObjs = []; this.pjPool = [];
    this.navDirty = true;
    // Phaser reuses the scene instance between rounds, so per-round references must be reset here
    this.botRunner = null; this.botSab = null; this.resumeLayer = null; this.keyObjs = {};
    Net.flags.ready = false;

    this.cameras.main.setBackgroundColor(theme().bg);
    this.cameras.main.fadeIn(400, 8, 9, 15);
    this.physics.world.setBounds(AX, AY, AW, AH);

    this.drawArena();
    this.buildSolids();
    this.buildMorphs();
    this.buildKund();
    this.buildRelics();
    this.buildPortal();
    this.buildRunner();
    this.buildDevils();
    this.buildReticle();
    this.buildFx();
    this.buildLighting();
    buildGrade(this, 38);
    this.buildHUD();
    this.setupKeys();
    this.bindInput();
    if (this.online) this.setupNet();
    if (this.kind === 'solo') {
      if (isBot(this.runnerIdx)) this.botRunner = new BotRunner(this, Match.diff);
      if (isBot(this.sabIdx)) this.botSab = new BotSaboteur(this, Match.diff);
    }

    AudioFX.startMusic('game');
    AudioFX.setTempo(112);
    AudioFX.holdMusic(false);
    this.events.once('shutdown', () => {
      this.input.keyboard.removeAllListeners();
      if (this.menu) { this.menu.destroy(); this.menu = null; }
      AudioFX.holdMusic(false);
    });

    const nameOf = idx => Match.players[idx].name.toUpperCase() + youTag(idx);
    const roleTag = idx => isBot(idx) ? 'AI ' + BOT_DIFF[Match.diff].tier : nameOf(idx);
    clashIntro(this,
      { name: 'YODHA VEER', sub: roleTag(this.runnerIdx) + '  ·  RUNNER' },
      { name: 'RAKSHASA KALAKETU', sub: roleTag(this.sabIdx) + '  ·  SABOTEUR' },
      () => { if (this.sys.isActive()) this.runCountdown(); });
  }

  // ---------------- networking ----------------
  setupNet() {
    const common = {
      pause: m => { if (m.on) this.openPause(true); else this.beginResume(true); },
      restart: () => this.scene.restart()
    };
    if (this.auth) {
      Net.setHandlers(Object.assign({
        in: m => { this.remoteIn = { ix: Phaser.Math.Clamp(+m.ix || 0, -1, 1), iy: Phaser.Math.Clamp(+m.iy || 0, -1, 1) }; },
        dash: () => this.tryDash(),
        shield: () => this.tryShield(),
        ret: m => { this.retTarget = { x: +m.x || 0, y: +m.y || 0 }; },
        cast: m => {
          if (!ABIL[m.ab]) return;
          if (this.retTarget) this.reticle.setPosition(this.retTarget.x, this.retTarget.y);
          this.cast(m.ab);
        }
      }, common));
    } else {
      this.runner.body.enable = false;           // the host owns physics; we only render
      Net.setHandlers(Object.assign({
        s: m => { this.snap = m; },
        ev: m => this.applyEvent(m),
        end: m => { Match = m.match; this.saveScore(); this.showEnd(m.escaped); }
      }, common));
    }
    this.events.once('shutdown', () => Net.setHandlers({}));
  }

  emit(ev) { if (this.online && this.auth) Net.send(Object.assign({ t: 'ev' }, ev)); }

  ftNet(x, y, s, c, z, snd) {
    floatText(this, x, y, s, c, z);
    if (snd && AudioFX[snd]) AudioFX[snd]();
    this.emit({ k: 'ft', x: Math.round(x), y: Math.round(y), s, c, z, snd });
  }

  applyEvent(m) {
    switch (m.k) {
      case 'ft': floatText(this, m.x, m.y, m.s, m.c, m.z); if (m.snd && AudioFX[m.snd]) AudioFX[m.snd](); break;
      case 'cast': this.castFx(m.ab); break;
      case 'tele': this.addTelegraph(m.ab, m.x, m.y, m.rects); break;
      case 'kala': this.raiseKala(m.rects, m.x, m.y); break;
      case 'fire': AudioFX.fireball(); this.fireBurst.explode(14, this.stage.kund.x, this.stage.kund.y - 10); break;
      case 'orbs': AudioFX.orb(); this.puff.explode(20, m.x, m.y); break;
      case 'relic': { const r = this.relicObjs[m.i]; if (r && !r.taken) this.collectRelic(r); break; }
      case 'hit': this.hitFx(m); break;
      case 'block': this.blockFx(m.x, m.y); break;
      case 'warp': this.warpFx(m.x0, m.y0, m.x1, m.y1); break;
      case 'dash': this.dashFx(m.x, m.y, m.vx, m.vy); break;
      case 'shield': this.shieldFx(m.mode); break;
      case 'ric': AudioFX.ricochet(); break;
    }
  }

  sendSnapshot() {
    const q = v => Math.round(v * 10) / 10, r = this.runner, b = r.body;
    Net.send({
      t: 's', st: this.state, x: q(r.x), y: q(r.y), vx: Math.round(b.velocity.x), vy: Math.round(b.velocity.y),
      im: this.immuneT > 0 || this.iframeT > 0 ? 1 : 0, iv: q(this.invertT), sl: q(this.slowT), sh: this.shieldOn > 0 ? 1 : 0,
      dc: q(this.dashCd), scd: q(this.shieldCd), rx: Math.round(this.reticle.x), ry: Math.round(this.reticle.y),
      cd: [q(this.cd.agni), q(this.cd.maya), q(this.cd.kala)], tl: Math.round(this.timeLeft * 100) / 100, tr: this.traps,
      pj: this.projectiles.map(p => [Math.round(p.x), Math.round(p.y), p.kind === 'fire' ? 0 : 1]),
      dv: this.devils.map(d => Math.round(d.t * 1000) / 1000)
    });
  }

  // ---------------- world construction ----------------
  drawArena() {
    const A = o => { this.arenaObjs.push(o); return o; };
    const S = this.stage, P = stagePal(S), light = Settings.theme === 'light';
    A(drawBackdrop(this, false));
    const g = this.add.graphics();
    g.fillStyle(P.floor, 1); g.fillRect(AX, AY, AW, AH);
    const T = 50;
    if (S.key === 'varanasi') {
      for (let y = AY; y < AY + AH; y += 25) {
        g.fillStyle((y / 25) % 2 ? P.tile : P.floor, 1); g.fillRect(AX, y, AW, 25);
        g.lineStyle(1, P.line, 0.7); g.lineBetween(AX, y, AX + AW, y);
        g.lineStyle(1, 0x000000, light ? 0.12 : 0.4); g.lineBetween(AX, y + 2, AX + AW, y + 2);
      }
    } else {
      for (let x = AX; x < AX + AW; x += T) for (let y = AY; y < AY + AH; y += T) {
        if (((x - AX) / T + (y - AY) / T) % 2 === 0) { g.fillStyle(P.tile, 1); g.fillRect(x, y, T, T); }
      }
      if (S.marble) {
        const rnd = mulberry32(11);
        g.lineStyle(1, P.line, light ? 0.5 : 0.35);
        for (let i = 0; i < 60; i++) {
          let x = AX + rnd() * AW, y = AY + rnd() * AH;
          g.beginPath(); g.moveTo(x, y);
          for (let k = 0; k < 5; k++) { x += (rnd() - 0.5) * 40; y += rnd() * 22; g.lineTo(x, y); }
          g.strokePath();
        }
      }
      g.lineStyle(1, P.line, 0.55);
      for (let x = AX; x <= AX + AW; x += T) g.lineBetween(x, AY, x, AY + AH);
      for (let y = AY; y <= AY + AH; y += T) g.lineBetween(AX, y, AX + AW, y);
      g.fillStyle(P.line, 1);
      for (let x = AX; x <= AX + AW; x += T) for (let y = AY; y <= AY + AH; y += T)
        g.fillPoints([{ x, y: y - 4 }, { x: x + 4, y }, { x, y: y + 4 }, { x: x - 4, y }], true);
    }
    [{ x: 340, y: 400, r: 120 }, { x: 640, y: 400, r: 175 }, { x: 940, y: 400, r: 120 }].forEach(m =>
      drawMandala(g, m.x, m.y, m.r, [P.accent, C.gold, P.line, light ? C.turquoise : C.ivory], 12, light ? 0.16 : 0.1));
    if (S.key === 'hampi') {
      const rnd = mulberry32(7);
      for (let i = 0; i < 90; i++) {
        g.fillStyle(rnd() < 0.5 ? P.wallLo : P.line, light ? 0.35 : 0.55);
        g.fillEllipse(AX + rnd() * AW, AY + rnd() * AH, 4 + rnd() * 10, 3 + rnd() * 6);
      }
    }
    drawMandala(g, S.spawn.x, S.spawn.y, 26, [C.saffron, C.gold, P.line, C.ivory], 8, 0.6);

    const z = this.add.graphics();
    S.pools.forEach(r => {
      z.fillStyle(P.wallHi, 1); z.fillRect(r.x - 6, r.y - 6, r.w + 12, r.h + 12);
      z.fillStyle(light ? 0x1f8fa8 : 0x15607a, 1); z.fillRect(r.x, r.y, r.w, r.h);
      z.fillStyle(light ? 0x5fd0e0 : 0x2a8fb0, 0.6); z.fillRect(r.x + 6, r.y + 6, r.w - 12, r.h - 12);
      z.lineStyle(1.5, C.gold, 0.6); z.strokeRect(r.x - 6, r.y - 6, r.w + 12, r.h + 12);

  drawWall(g, w, P) {
    if (w.pillar) {
      const cx = w.x + w.w / 2, cy = w.y + w.h / 2;
      g.fillStyle(P.wallLo, 1); g.fillRect(w.x, w.y, w.w, w.h);
      g.fillStyle(P.wall, 1); g.fillRect(w.x + 3, w.y + 3, w.w - 6, w.h - 6);
      g.fillStyle(P.wallHi, 1); g.fillCircle(cx, cy, w.w * 0.34);
      g.lineStyle(2, P.wallLo, 1); g.strokeCircle(cx, cy, w.w * 0.34);
      g.fillStyle(P.wall, 1);
      for (let i = 0; i < 8; i++) g.fillPoints(petalPts(cx, cy, i / 8 * TAU, w.w * 0.06, w.w * 0.3, w.w * 0.06), true);
      g.fillStyle(P.accent, 1); g.fillCircle(cx, cy, 3);
      g.fillStyle(0xffffff, 0.18); g.fillRect(w.x + 3, w.y + 3, w.w - 6, 4);
      g.fillStyle(P.wallHi, 0.8); [[w.x + 5, w.y + 5], [w.x + w.w - 5, w.y + 5], [w.x + 5, w.y + w.h - 5], [w.x + w.w - 5, w.y + w.h - 5]].forEach(p => g.fillCircle(p[0], p[1], 2));
    } else {
      g.fillStyle(P.wallLo, 1); g.fillRect(w.x, w.y, w.w, w.h);
      g.fillStyle(P.wall, 1); g.fillRect(w.x + 2, w.y + 2, w.w - 4, w.h - 6);
      g.fillStyle(P.wallHi, 0.9); g.fillRect(w.x + 2, w.y + 2, w.w - 4, 3);
      const horiz = w.w >= w.h, len = horiz ? w.w : w.h, th = horiz ? w.h : w.w;
      const cnt = Math.max(1, Math.floor(len / 28)), ds = Math.min(th * 0.28, 6);
      g.lineStyle(1.2, P.wallLo, 0.9);
      for (let i = 0; i < cnt; i++) {
        const t = (i + 0.5) / cnt;
        const cx = horiz ? w.x + w.w * t : w.x + w.w / 2, cy = horiz ? w.y + w.h / 2 - 1 : w.y + w.h * t;
        g.strokePoints([{ x: cx, y: cy - ds }, { x: cx + ds, y: cy }, { x: cx, y: cy + ds }, { x: cx - ds, y: cy }], true);
        if (i > 0) {
          const bx = horiz ? w.x + w.w * i / cnt : w.x, by = horiz ? w.y : w.y + w.h * i / cnt;
          if (horiz) g.lineBetween(bx, by + 3, bx, by + w.h - 4); else g.lineBetween(bx + 2, by, bx + w.w - 2, by);
        }
      }
    }
  }

  // live theme switch: redraw the arena, lighting and grading without restarting the round
  applyTheme() {
    document.body.classList.toggle('light', Settings.theme === 'light');
    this.arenaObjs.forEach(o => { this.tweens.killTweensOf(o); o.destroy(); });
    this.arenaObjs = [];
    this.cameras.main.setBackgroundColor(theme().bg);
    this.drawArena();
    this.buildLighting();
    buildGrade(this, 38);
    this.hero.shadow.setAlpha(theme().shadow);
    this.themeBtn.setText(Settings.theme === 'dark' ? '☾ RATRI  ·  T' : '☀ SURYA  ·  T');
  }
  toggleTheme() {
    Settings.theme = Settings.theme === 'dark' ? 'light' : 'dark';
    Settings.save();
    this.applyTheme();
  }

  buildSolids() {
    this.walls = this.physics.add.staticGroup();
    this.stage.walls.concat(this.stage.moat).forEach(w => this.addSolid(w.x, w.y, w.w, w.h));
    const toRect = r => new Phaser.Geom.Rectangle(r.x, r.y, r.w, r.h);
    this.poolRects = this.stage.pools.map(toRect);
    this.lavaRects = this.stage.lava.map(toRect);
    this.staticRects = this.stage.walls.concat(this.stage.moat).map(toRect);
  }
  addSolid(x, y, w, h) {
    const r = this.add.rectangle(x + w / 2, y + h / 2, w, h, 0x000000, 0);
    this.physics.add.existing(r, true);
    this.walls.add(r);
    return r;
  }
  // every blocking rectangle right now (static walls + live Kala pillars)
  solidRects() { return this.staticRects.concat(this.pillars.map(p => p.rect)); }
  pointBlocked(x, y, rad) {
    const c = new Phaser.Geom.Circle(x, y, rad || 14);
    if (x < AX + 14 || x > AX + AW - 14 || y < AY + 14 || y > AY + AH - 14) return true;
    return this.solidRects().some(r => Phaser.Geom.Intersects.CircleToRectangle(c, r)) || this.lavaRects.some(r => Phaser.Geom.Intersects.CircleToRectangle(c, r));
  }

  buildMorphs() {
    const B = Phaser.BlendModes, cx = AX + AW / 2, cy = AY + AH / 2;
    const layer = () => this.add.container(0, 0).setDepth(1.6).setAlpha(0);
    // Agni-Loka: molten volcanic temple with glowing lava cracks and embers
    const ag = layer();
    const agTint = this.add.rectangle(cx, cy, AW, AH, 0x6a1800, 0.55).setBlendMode(B.MULTIPLY);
    const agAdd = this.add.rectangle(cx, cy, AW, AH, 0xff5a1a, 0.12).setBlendMode(B.ADD);
    const cg = this.add.graphics();
    const rnd = mulberry32(31);
    for (let i = 0; i < 26; i++) {
      let x = AX + rnd() * AW, y = AY + rnd() * AH;
      const pts = [{ x, y }];
      for (let k = 0; k < 6; k++) { x += (rnd() - 0.5) * 90; y += (rnd() - 0.5) * 90; pts.push({ x: Phaser.Math.Clamp(x, AX, AX + AW), y: Phaser.Math.Clamp(y, AY, AY + AH) }); }
      cg.lineStyle(5, 0xff3d00, 0.55); cg.strokePoints(pts, false);
      cg.lineStyle(2, C.gold, 0.9); cg.strokePoints(pts, false);
    }
    const cracks = bakeRegion(this, cg, AX, AY, AW, AH).setBlendMode(B.ADD);
    ag.add([agTint, agAdd, cracks]);
    this.agCracks = cracks;
    this.morphEmbers = this.add.particles(0, 0, 'dot', {
      emitting: false, emitZone: { type: 'random', source: new Phaser.Geom.Rectangle(AX, AY + AH * 0.3, AW, AH * 0.7) },
      speedY: { min: -120, max: -40 }, speedX: { min: -20, max: 20 }, lifespan: 1600, scale: { start: 0.8, end: 0 },
      alpha: { start: 1, end: 0 }, tint: [C.gold, C.saffron, 0xff3d00], blendMode: 'ADD', frequency: 14 / Settings.particles()
    }).setDepth(1.7);
    // Maya-Jaal: cosmic purple-cyan dimension with a giant spinning Sri Yantra
    const my = layer();
    const myTint = this.add.rectangle(cx, cy, AW, AH, 0x2a0a6a, 0.55).setBlendMode(B.MULTIPLY);
    const myAdd = this.add.rectangle(cx, cy, AW, AH, 0x3a6aff, 0.1).setBlendMode(B.ADD);
    const yg = this.add.graphics();
    drawSriYantra(yg, 290, 290, 260, 0x5ff2ff, 0.55);
    drawSriYantra(yg, 290, 290, 200, C.violet, 0.4);
    const yantra = bakeRegion(this, yg, 0, 0, 580, 580).setOrigin(0.5).setPosition(cx, cy).setBlendMode(B.ADD);
    const sg = this.add.graphics();
    for (let i = 0; i < 90; i++) { sg.fillStyle(i % 3 ? 0xbfe9ff : 0xd6b8ff, 0.4 + rnd() * 0.5); sg.fillCircle(AX + rnd() * AW, AY + rnd() * AH, 0.8 + rnd() * 1.6); }
    const stars = bakeRegion(this, sg, AX, AY, AW, AH).setBlendMode(B.ADD);
    my.add([myTint, myAdd, stars, yantra]);
    this.yantra = yantra;
    // Kala-Stambha: emerald-obsidian chamber of grinding stone gears
    const kl = layer();
    const klTint = this.add.rectangle(cx, cy, AW, AH, 0x0a3a26, 0.6).setBlendMode(B.MULTIPLY);
    const klAdd = this.add.rectangle(cx, cy, AW, AH, 0x00a878, 0.08).setBlendMode(B.ADD);
    kl.add([klTint, klAdd]);
    this.gears = [[AX + 170, AY + 150, 110, 14], [AX + AW - 190, AY + AH - 160, 140, 18], [cx, cy, 80, 10], [AX + AW - 260, AY + 130, 70, 9]].map(([x, y, r, n], i) => {
      const gr = this.add.graphics(), sz = r * 2 + 10;
      drawGear(gr, sz / 2, sz / 2, r, n, i % 2 ? 0x2f6a52 : 0x1f4a3a, 0.6);
      const gg = bakeRegion(this, gr, 0, 0, sz, sz).setOrigin(0.5).setPosition(x, y).setBlendMode(B.SCREEN);
      kl.add(gg);
      return { g: gg, s: (i % 2 ? -1 : 1) * (0.6 / (r / 80)) };
    });
    this.morphLayers = { agni: ag, maya: my, kala: kl };
  }
  morph(type) {
    Object.keys(this.morphLayers).forEach(k => {
      const L = this.morphLayers[k];
      this.tweens.killTweensOf(L);
      if (k === type) { this.morphT[k] = MORPH_TIME; this.tweens.add({ targets: L, alpha: 1, duration: 300 }); }
      else if (this.morphT[k] > 0) { this.morphT[k] = 0; this.tweens.add({ targets: L, alpha: 0, duration: 300 }); }
    });
    if (type === 'agni') this.morphEmbers.start(); else this.morphEmbers.stop();
  }
  updateMorphs(dt) {
    Object.keys(this.morphT).forEach(k => {
      if (this.morphT[k] <= 0) return;
      this.morphT[k] -= dt;
      if (this.morphT[k] <= 0) {
        this.tweens.killTweensOf(this.morphLayers[k]);
        this.tweens.add({ targets: this.morphLayers[k], alpha: 0, duration: 500 });
        if (k === 'agni') this.morphEmbers.stop();
      }
    });
    if (this.morphT.maya > 0) this.yantra.rotation += dt * 0.6;
    if (this.morphT.kala > 0) this.gears.forEach(g => { g.g.rotation += dt * g.s; });
    if (this.morphT.agni > 0) this.agCracks.setAlpha(0.7 + 0.3 * Math.sin(this.envT * 9));
  }

  // ---------------- HUD ----------------

    g.lineStyle(2, col, 0.95); g.strokeRoundedRect(x, y, w, h, 14);

    this.trapsText = txt(32, 62, '', 12, '#F4D03F');
    this.relicIcons = [0, 1, 2].map(i => this.add.image(268 + i * 26, 70, 'relic').setScale(0.48).setAlpha(0.22).setDepth(D + 1));
    this.skillG = this.add.graphics().setDepth(D + 1);
    this.skillTexts = ['dash', 'shield'].map((k, i) => ({
      key: txt(392 + i * 58, 44, '', 11, '#F6E7C1', { fontStyle: 'bold' }).setOrigin(0.5).setDepth(D + 2),
      name: txt(392 + i * 58, 78, k === 'dash' ? 'GARUDA' : 'SUDARSHAN', 9, '#c9b48a', { fontStyle: 'bold' }).setOrigin(0.5).setDepth(D + 2)
    }));

    this.timerText = txt(640, 40, '45.0', 34, '#F4D03F', { fontStyle: 'bold' }).setOrigin(0.5);
    this.add.text(640, 70, 'ROUND ' + (Match.current + 1) + ' / ' + Match.rounds.length, {
      fontFamily: FONT, fontSize: '11px', color: '#FF9933', fontStyle: 'bold'
    }).setOrigin(0.5).setDepth(D + 1);

    txt(810, 62, '5.0s cooldowns · 0.7s telegraph', 12, '#c9b48a');
    this.abilG = this.add.graphics().setDepth(D + 1);
    this.abilTexts = ABIL_ORDER.map((k, i) => {
      const A = ABIL[k], x = 1070 + i * 64;
      return {
        mid: txt(x, 41, '', 14, '#F6E7C1', { fontStyle: 'bold' }).setOrigin(0.5).setDepth(D + 2),
        name: txt(x, 79, A.name, 10, hex(A.col), { fontStyle: 'bold' }).setOrigin(0.5).setDepth(D + 2)
      };
    });

    this.add.text(AX, 711, this.stage.name.toUpperCase() + '  ·  ' + this.stage.dev + '   ·   ' +
      (this.online ? 'ONLINE ' + (Net.isHost ? '(HOST)' : '(GUEST)') + ' · ' + (Net.via === 'relay' ? 'FIREBASE RELAY' : 'P2P') : this.kind === 'solo' ? 'SOLO vs AI · ' + BOT_DIFF[Match.diff].tier : 'LOCAL 2P'), {
      fontFamily: FONT_DEV, fontSize: '12px', color: hex(stagePal(this.stage).accent), stroke: '#0B0C10', strokeThickness: 2
    }).setOrigin(0, 0.5).setDepth(D);
    this.themeBtn = this.add.text(1060, 711, Settings.theme === 'dark' ? '☾ RATRI  ·  T' : '☀ SURYA  ·  T', {
      fontFamily: FONT, fontSize: '12px', color: '#F4D03F', fontStyle: 'bold', backgroundColor: '#0d1018', padding: { x: 8, y: 2 }
    }).setOrigin(0.5).setDepth(D).setInteractive({ useHandCursor: true });

    }).setOrigin(1, 0.5).setDepth(D).setInteractive({ useHandCursor: true });
    menuBtn.on('pointerdown', () => this.openPause());
